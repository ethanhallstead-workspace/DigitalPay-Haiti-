<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#00B4FF">
  <script>(function(){try{var t=localStorage.getItem('dp_theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <title>Créer un compte — DigitalPay Haiti</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/assets/site.webmanifest">

  <style>
    :root {
      --bg-page: #F5F7FB; --bg-card: #FFFFFF; --bg-subtle: #F0F4F9; --bg-hover: #F8FAFC;
      --bg-glass: rgba(245, 247, 251, 0.72);
      --border-subtle: #EDF1F7; --border-default: #E1E8F0; --border-strong: #C7D2E0;
      --text-primary: #0A1633; --text-secondary: #4A5568; --text-tertiary: #8B94A7; --text-quaternary: #B5BDCA;
      --blue-25: #F0F9FF; --blue-50: #E0F2FE; --blue-100: #BAE6FD; --blue-200: #7DD3FC;
      --blue-400: #38BDF8; --blue-500: #00B4FF; --blue-600: #0055FF; --blue-700: #003BCC;
      --blue-gradient: linear-gradient(135deg, #00B4FF 0%, #0055FF 100%);
      --success: #059669; --success-bg: #ECFDF5; --success-border: #A7F3D0;
      --danger: #DC2626; --danger-bg: #FEF2F2; --danger-border: #FECACA;
      --warning: #D97706; --warning-bg: #FFFBEB;
      --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px; --r-2xl: 28px; --r-3xl: 36px; --r-full: 9999px;
      --shadow-2xs: 0 1px 1px rgba(10, 22, 51, 0.03);
      --shadow-xs: 0 1px 2px rgba(10, 22, 51, 0.04), 0 1px 1px rgba(10, 22, 51, 0.02);
      --shadow-sm: 0 2px 4px rgba(10, 22, 51, 0.04), 0 1px 2px rgba(10, 22, 51, 0.03);
      --shadow-md: 0 4px 8px rgba(10, 22, 51, 0.05), 0 2px 4px rgba(10, 22, 51, 0.03);
      --shadow-lg: 0 8px 16px rgba(10, 22, 51, 0.06), 0 4px 8px rgba(10, 22, 51, 0.04);
      --shadow-xl: 0 16px 32px rgba(10, 22, 51, 0.08), 0 8px 16px rgba(10, 22, 51, 0.04);
      --shadow-2xl: 0 28px 56px rgba(10, 22, 51, 0.12), 0 12px 24px rgba(10, 22, 51, 0.06);
      --shadow-blue: 0 4px 12px rgba(0, 85, 255, 0.22), 0 10px 28px rgba(0, 85, 255, 0.14);
      --shadow-blue-lg: 0 8px 20px rgba(0, 85, 255, 0.28), 0 16px 40px rgba(0, 85, 255, 0.16);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body { background: var(--bg-page); color: var(--text-primary); font-family: var(--font); font-size: 14px; line-height: 1.5; min-height: 100vh; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; opacity: 0; transition: opacity 0.4s ease; }
    body.ready { opacity: 1; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 3px; }

    .app-shell { width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg-page); position: relative; display: flex; flex-direction: column; border-left: 1px solid var(--border-subtle); border-right: 1px solid var(--border-subtle); }

    /* ═══ HERO ═══ */
    .auth-hero {
      position: relative;
      background: linear-gradient(135deg, #0A1633 0%, #003BCC 45%, #00B4FF 100%);
      padding: 36px 24px 32px;
      color: #FFFFFF;
      overflow: hidden;
      border-radius: 0 0 32px 32px;
      margin-bottom: 22px;
      box-shadow: 0 12px 32px rgba(0, 85, 255, 0.24);
    }
    .auth-hero::after { content: ''; position: absolute; top: -80px; right: -80px; width: 260px; height: 260px; background: radial-gradient(circle, rgba(255,255,255,0.16) 0%, transparent 70%); pointer-events: none; }
    .auth-hero::before { content: ''; position: absolute; bottom: -60px; left: -40px; width: 180px; height: 180px; background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%); pointer-events: none; }
    .auth-hero-top { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; position: relative; z-index: 1; }
    .auth-hero-logo {
      width: 48px; height: 48px; border-radius: 15px;
      background: rgba(255,255,255,0.18); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      flex-shrink: 0;
      overflow: hidden;
    }
    .auth-hero-logo img { width: 100%; height: 100%; object-fit: contain; padding: 8px; }
    .auth-hero-brand { min-width: 0; }
    .auth-hero-brand-name { font-size: 14px; font-weight: 900; letter-spacing: -0.3px; line-height: 1.1; text-transform: uppercase; }
    .auth-hero-brand-sub { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.75); text-transform: uppercase; letter-spacing: 1px; margin-top: 3px; }
    .auth-hero-title { font-size: 26px; font-weight: 900; letter-spacing: -0.7px; line-height: 1.1; margin-bottom: 6px; position: relative; z-index: 1; }
    .auth-hero-sub { font-size: 12.5px; color: rgba(255,255,255,0.85); line-height: 1.5; position: relative; z-index: 1; max-width: 340px; }

    /* ═══ PERKS (petits arguments) ═══ */
    .perks-row { display: flex; gap: 8px; margin-top: 18px; position: relative; z-index: 1; }
    .perk { background: rgba(255,255,255,0.14); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.18); border-radius: var(--r-full); padding: 5px 10px; font-size: 10.5px; font-weight: 800; color: #FFFFFF; display: flex; align-items: center; gap: 5px; letter-spacing: 0.2px; }
    .perk svg { width: 11px; height: 11px; stroke: #FFFFFF; stroke-width: 2.6; fill: none; flex-shrink: 0; }

    /* ═══ AUTH MAIN ═══ */
    .auth-main { padding: 0 22px 30px; flex: 1; }

    /* ═══ GOOGLE BUTTON ═══ */
    .btn-google {
      width: 100%;
      height: 54px;
      background: #FFFFFF;
      border: 1.5px solid var(--border-default);
      border-radius: var(--r-md);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: inherit;
      transition: all 0.2s var(--ease-out);
      box-shadow: var(--shadow-xs);
      letter-spacing: -0.1px;
      position: relative;
      overflow: hidden;
    }
    .btn-google:hover:not(:disabled) { border-color: var(--border-strong); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
    .btn-google:active:not(:disabled) { transform: scale(0.985); }
    .btn-google:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }

    /* ═══ DIVIDER ═══ */
    .auth-divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
    .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border-subtle); }
    .auth-divider span { font-size: 11px; font-weight: 800; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.8px; }

    /* ═══ FIELDS ═══ */
    .field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
    .field-label { font-size: 11.5px; font-weight: 800; color: var(--text-primary); text-transform: uppercase; letter-spacing: 0.4px; }
    .field-wrap { position: relative; display: flex; align-items: center; }
    .field-icon-left { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); pointer-events: none; display: flex; transition: color 0.2s ease; }
    .field-wrap:focus-within .field-icon-left { color: var(--blue-600); }
    .field-icon-left svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 2; fill: none; }

    .text-input {
      width: 100%;
      height: 52px;
      background: var(--bg-card);
      border: 1.5px solid var(--border-default);
      border-radius: var(--r-md);
      padding: 0 46px 0 44px;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-primary);
      outline: none;
      font-family: inherit;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-2xs);
    }
    .text-input::placeholder { color: var(--text-quaternary); font-weight: 500; }
    .text-input:focus {
      border-color: var(--blue-600);
      box-shadow: 0 0 0 4px var(--blue-50), var(--shadow-sm);
      background: #FFFFFF;
    }
    .text-input.error { border-color: var(--danger); }
    .text-input.error:focus { box-shadow: 0 0 0 4px var(--danger-bg); }
    .text-input.valid { border-color: var(--success-border); }
    .text-input.valid:focus { box-shadow: 0 0 0 4px var(--success-bg); border-color: var(--success); }

    .field-toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .field-toggle:hover { background: var(--bg-subtle); color: var(--text-primary); }
    .field-toggle:active { transform: translateY(-50%) scale(0.9); }
    .field-toggle svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 2; fill: none; }

    /* ═══ PASSWORD STRENGTH ═══ */
    .pwd-strength {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: -4px;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: all 0.3s var(--ease-out);
    }
    .pwd-strength.visible { opacity: 1; max-height: 30px; margin-top: 6px; }
    .pwd-bars { display: flex; gap: 4px; flex: 1; }
    .pwd-bar { flex: 1; height: 4px; border-radius: 2px; background: var(--bg-subtle); transition: background 0.3s ease; }
    .pwd-bar.weak { background: var(--danger); }
    .pwd-bar.medium { background: var(--warning); }
    .pwd-bar.strong { background: var(--success); }
    .pwd-strength-label { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0; min-width: 60px; text-align: right; }
    .pwd-strength-label.weak { color: var(--danger); }
    .pwd-strength-label.medium { color: var(--warning); }
    .pwd-strength-label.strong { color: var(--success); }

    /* ═══ PASSWORD MATCH INDICATOR ═══ */
    .pwd-match {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .pwd-match.visible { display: flex; }
    .pwd-match svg { width: 20px; height: 20px; stroke-width: 2.4; fill: none; }
    .pwd-match.match svg { stroke: var(--success); }
    .pwd-match.mismatch svg { stroke: var(--danger); }

    /* ═══ TERMS CHECKBOX ═══ */
    .terms-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 18px 0 22px;
      cursor: pointer;
      user-select: none;
      padding: 4px;
    }
    .terms-row input { position: absolute; opacity: 0; pointer-events: none; }
    .terms-check {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 1.5px solid var(--border-strong);
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s ease;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .terms-check svg { width: 12px; height: 12px; stroke: #FFFFFF; stroke-width: 3; fill: none; opacity: 0; transition: opacity 0.15s ease; }
    .terms-row input:checked + .terms-check { background: var(--blue-gradient); border-color: transparent; box-shadow: 0 3px 10px rgba(0, 85, 255, 0.28); }
    .terms-row input:checked + .terms-check svg { opacity: 1; }
    .terms-row input:focus-visible + .terms-check { outline: 2px solid var(--blue-600); outline-offset: 2px; }
    .terms-label { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); line-height: 1.5; flex: 1; }
    .terms-label a { color: var(--blue-600); font-weight: 800; text-decoration: none; }
    .terms-label a:hover { text-decoration: underline; }
    .terms-row.shake { animation: shake-row 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
    @keyframes shake-row {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* ═══ SUBMIT ═══ */
    .btn-submit-register {
      width: 100%;
      height: 54px;
      background: var(--blue-gradient);
      color: #FFFFFF;
      border: none;
      border-radius: var(--r-md);
      font-size: 14.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: inherit;
      box-shadow: var(--shadow-blue);
      transition: all 0.2s var(--ease-out);
      letter-spacing: -0.1px;
      position: relative;
      overflow: hidden;
    }
    .btn-submit-register:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0, 85, 255, 0.3), 0 14px 32px rgba(0, 85, 255, 0.18); }
    .btn-submit-register:active:not(:disabled) { transform: scale(0.985); }
    .btn-submit-register:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: none; transform: none; }
    .btn-submit-register .spinner { width: 20px; height: 20px; border: 2.5px solid rgba(255,255,255,0.3); border-top-color: #FFFFFF; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
    .btn-submit-register.loading .spinner { display: block; }
    .btn-submit-register.loading .btn-label { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ═══ ERROR/SUCCESS BOXES ═══ */
    .auth-error {
      margin-top: 14px;
      padding: 12px 14px;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      border-radius: var(--r-md);
      font-size: 12.5px;
      font-weight: 700;
      color: var(--danger);
      display: none;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.5;
    }
    .auth-error.visible { display: flex; }
    .auth-error svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.4; fill: none; flex-shrink: 0; margin-top: 1px; }

    .auth-success {
      margin-top: 14px;
      padding: 12px 14px;
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      border-radius: var(--r-md);
      font-size: 12.5px;
      font-weight: 700;
      color: var(--success);
      display: none;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.5;
    }
    .auth-success.visible { display: flex; }
    .auth-success svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.4; fill: none; flex-shrink: 0; margin-top: 1px; }

    /* ═══ BOTTOM CTA ═══ */
    .auth-bottom { text-align: center; margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--border-subtle); }
    .auth-bottom-text { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px; }
    .btn-secondary-outline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1.5px solid var(--border-default);
      color: var(--text-primary);
      padding: 12px 22px;
      border-radius: var(--r-md);
      font-size: 13.5px;
      font-weight: 800;
      text-decoration: none;
      font-family: inherit;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-2xs);
      letter-spacing: -0.1px;
    }
    .btn-secondary-outline:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
    .btn-secondary-outline:active { transform: translateY(0) scale(0.98); }
    .btn-secondary-outline svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2.2; fill: none; }

    /* ═══ TRUST STRIP ═══ */
    .trust-mini { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 20px; font-size: 10.5px; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.4px; }
    .trust-mini-item { display: flex; align-items: center; gap: 5px; }
    .trust-mini-item svg { width: 12px; height: 12px; stroke: var(--success); stroke-width: 2.4; fill: none; }

    /* ═══ TOASTS ═══ */
    #toast-container { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 400; width: calc(100% - 32px); max-width: 400px; pointer-events: none; }
    .toast { background: var(--text-primary); color: #FFFFFF; padding: 14px 16px; border-radius: var(--r-md); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-2xl); transform: translateY(-20px); opacity: 0; transition: all 0.35s var(--ease-spring); overflow: hidden; position: relative; }
    .toast::after { content: ''; position: absolute; bottom: 0; left: 0; height: 2px; background: var(--blue-600); width: 100%; transform-origin: left; animation: toast-progress 2.6s linear forwards; }
    @keyframes toast-progress { from { transform: scaleX(1); } to { transform: scaleX(0); } }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success::after { background: #34D399; }
    .toast.danger { background: #7F1D1D; }
    .toast.danger::after { background: #FCA5A5; }
    .toast.warning { background: #78350F; }
    .toast.warning::after { background: #FCD34D; }
    .toast.info { background: #1E3A8A; }
    .toast.info::after { background: #93C5FD; }
    .toast-icon { flex-shrink: 0; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
    .toast-icon svg { width: 18px; height: 18px; stroke-width: 2.5; fill: none; }
    .toast.success .toast-icon svg { stroke: #34D399; }
    .toast.danger .toast-icon svg { stroke: #FCA5A5; }
    .toast.warning .toast-icon svg { stroke: #FCD34D; }
    .toast.info .toast-icon svg { stroke: #93C5FD; }
    .toast-msg { flex: 1; line-height: 1.35; }

    .ripple { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.5); transform: scale(0); animation: ripple-anim 0.6s var(--ease-out); pointer-events: none; }
    .btn-google .ripple, .btn-secondary-outline .ripple { background: rgba(0, 85, 255, 0.15); }
    @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }

    /* Dark mode */
    html[data-theme="dark"] .btn-google { background: var(--bg-card); color: var(--text-primary); }
    html[data-theme="dark"] .text-input { background: var(--bg-card); color: var(--text-primary); }
    html[data-theme="dark"] .text-input:focus { background: var(--bg-card); }
  </style>

  <link rel="stylesheet" href="/assets/css/design-system.css">
</head>
<body>

  <div id="toast-container"></div>

  <div class="app-shell">

    <!-- HERO -->
    <div class="auth-hero">
      <div class="auth-hero-top">
        <div class="auth-hero-logo">
          <img src="assets/logo.png" alt="DigitalPay" onerror="this.style.display='none';">
        </div>
        <div class="auth-hero-brand">
          <div class="auth-hero-brand-name">DigitalPay</div>
          <div class="auth-hero-brand-sub">Haiti</div>
        </div>
      </div>
      <div class="auth-hero-title" data-i18n="heroTitle">Créer un compte</div>
      <div class="auth-hero-sub" data-i18n="heroSub">Rejoignez des milliers de clients et accédez à tous nos services en quelques secondes.</div>
      <div class="perks-row">
        <div class="perk">
          <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="perkFast">Rapide</span>
        </div>
        <div class="perk">
          <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span data-i18n="perkSecure">Sécurisé</span>
        </div>
        <div class="perk">
          <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="perkFree">Gratuit</span>
        </div>
      </div>

    function escapeHtml(str) {
      if (str === undefined || str === null) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      container.innerHTML = '';
      const config = {
        success: { icon: '<path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/>' },
        danger:  { icon: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>' },
        warning: { icon: '<path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>' },
        info:    { icon: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>' }
      };
      const c = config[type] || config.info;
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<div class="toast-icon"><svg viewBox="0 0 24 24">${c.icon}</svg></div><div class="toast-msg">${escapeHtml(message)}</div>`;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 350); }, 2600);
    }

    function createRipple(e, el) {
      const rect = el.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const x = (e.clientX || rect.left + rect.width / 2) - rect.left - size / 2;
      const y = (e.clientY || rect.top + rect.height / 2) - rect.top - size / 2;
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';
      el.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    }

    function vibrate(ms = 8) { if ('vibrate' in navigator) { try { navigator.vibrate(ms); } catch (e) {} } }

    function showError(msg) {
      const box = document.getElementById('auth-error');

      hideSuccess();
    }

    function hideError() {
      const box = document.getElementById('auth-error');
      if (box) box.classList.remove('visible');

    function showSuccess(msg) {

    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (!input || !icon) return;
      if (input.type === 'password') {
        input.type = 'text';

      } else {
        input.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
      vibrate(4);
    }

    /* ═══ PASSWORD STRENGTH ═══ */
    function getPasswordStrength(pwd) {
      if (!pwd || pwd.length < 6) return 0;
      let score = 0;
      if (pwd.length >= 8) score++;
      if (pwd.length >= 12) score++;
      if (/[a-z]/.test(pwd) && /[A-Z]/.test(pwd)) score++;
      if (/\d/.test(pwd)) score++;
      if (/[^a-zA-Z0-9]/.test(pwd)) score++;
      if (score <= 1) return 1;
      if (score <= 3) return 2;
      return 3;
    }

    function onPasswordInput() {
      const pwd = document.getElementById('reg-password').value;
      const wrapper = document.getElementById('pwd-strength');
      const bar1 = document.getElementById('pwd-bar-1');
      const bar2 = document.getElementById('pwd-bar-2');
      const bar3 = document.getElementById('pwd-bar-3');
      const label = document.getElementById('pwd-strength-label');

      [bar1, bar2, bar3].forEach(b => b.className = 'pwd-bar');
      label.className = 'pwd-strength-label';
      label.textContent = '';

      if (!pwd) {
        wrapper.classList.remove('visible');
        return;
      }
      wrapper.classList.add('visible');

      const strength = getPasswordStrength(pwd);
      if (strength === 1) {
        bar1.classList.add('weak');
        label.textContent = t('strengthWeak');
        label.classList.add('weak');
      } else if (strength === 2) {
        bar1.classList.add('medium');
        bar2.classList.add('medium');
        label.textContent = t('strengthMedium');
        label.classList.add('medium');
      } else if (strength === 3) {
        bar1.classList.add('strong');
        bar2.classList.add('strong');
        bar3.classList.add('strong');
        label.textContent = t('strengthStrong');
        label.classList.add('strong');
      }
      // Update confirm indicator too
      onConfirmInput();
    }

    /* ═══ CONFIRM MATCH ═══ */
    function onConfirmInput() {
      const pwd = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;
      const indicator = document.getElementById('pwd-match');
      const icon = document.getElementById('pwd-match-icon');
      const confirmInput = document.getElementById('reg-confirm');

      if (!confirm) {
        indicator.classList.remove('visible', 'match', 'mismatch');
        confirmInput.classList.remove('error', 'valid');
        return;
      }
      indicator.classList.add('visible');
      if (confirm === pwd) {
        indicator.classList.remove('mismatch');
        indicator.classList.add('match');
        icon.innerHTML = '<path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/>';
        confirmInput.classList.remove('error');
        confirmInput.classList.add('valid');
      } else {
        indicator.classList.remove('match');
        indicator.classList.add('mismatch');
        icon.innerHTML = '<path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/>';
        confirmInput.classList.remove('valid');
        confirmInput.classList.add('error');
      }
    }

    function applyTranslations() {
      document.documentElement.setAttribute('lang', STATE.lang);
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (I18N[STATE.lang][key]) el.textContent = I18N[STATE.lang][key];
      });
    }

    function setLang(code) {
      if (!I18N[code]) return;
      STATE.lang = code;
      localStorage.setItem('dp_lang', code);
      applyTranslations();
      // Refresh strength label if visible
      onPasswordInput();
    }

    function mapFirebaseError(code) {
      const map = {
        'auth/email-already-in-use': 'errEmailInUse',
        'auth/invalid-email': 'errEmailInvalid',
        'auth/weak-password': 'errWeakPassword',
        'auth/too-many-requests': 'errTooManyRequests',
        'auth/network-request-failed': 'errNetwork',
        'auth/popup-closed-by-user': 'errGooglePopupClosed',
        'auth/popup-blocked': 'errGooglePopupBlocked',
        'auth/cancelled-popup-request': 'errGoogleCancelled',
        'auth/account-exists-with-different-credential': 'errGoogleAccountExists'
      };
      return t(map[code] || 'errGeneric');
    }

    /* ═══ GOOGLE SIGN-UP ═══ */
    async function signInWithGoogle(e) {
      if (STATE.googleSubmitting) return;
      STATE.googleSubmitting = true;
      const btn = document.getElementById('btn-google');
      btn.disabled = true;
      hideError();
      hideSuccess();

      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        const result = await auth.signInWithPopup(provider);
        const user = result.user;

        const userDoc = await db.collection('users').doc(user.uid).get();
        if (!userDoc.exists) {
          await db.collection('users').doc(user.uid).set({
            uid: user.uid,
            displayName: user.displayName || 'Client',
            email: user.email,
            walletBalance: 0,
            role: 'client',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
        }

        vibrate(12);
        showSuccess(t('successRegister'));
        setTimeout(() => { window.location.href = '../index.html'; }, 900);
      } catch (err) {
        console.warn('[Google sign-up]', err.code, err.message);
        showError(mapFirebaseError(err.code) || t('errGoogleGeneric'));
        vibrate(20);
      } finally {
        STATE.googleSubmitting = false;
        btn.disabled = false;
      }
    }

    /* ═══ EMAIL REGISTER ═══ */
    async function handleEmailRegister(e) {
      if (STATE.submitting) return;
      hideError();
      hideSuccess();

      const name = sanitize(document.getElementById('reg-name').value, 60);
      const email = sanitize(document.getElementById('reg-email').value, 100).toLowerCase();
      const password = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;
      const termsChecked = document.getElementById('reg-terms').checked;
      const btn = document.getElementById('btn-submit-register');

      // Reset error classes
      ['reg-name', 'reg-email', 'reg-password', 'reg-confirm'].forEach(id => {
        document.getElementById(id).classList.remove('error');
      });

      // Validate
      if (!name) {
        document.getElementById('reg-name').classList.add('error');
        showError(t('errNameRequired'));
        vibrate(20);
        return;
      }
      if (name.length < 2) {
        document.getElementById('reg-name').classList.add('error');
        showError(t('errNameShort'));
        vibrate(20);
        return;
      }
      if (!email) {
        document.getElementById('reg-email').classList.add('error');
        showError(t('errEmailRequired'));
        vibrate(20);
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById('reg-email').classList.add('error');
        showError(t('errEmailInvalid'));
        vibrate(20);
        return;
      }
      if (!password) {
        document.getElementById('reg-password').classList.add('error');
        showError(t('errPasswordRequired'));
        vibrate(20);
        return;
      }
      if (password.length < 6) {
        document.getElementById('reg-password').classList.add('error');
        showError(t('errPasswordShort'));
        vibrate(20);
        return;
      }
      if (getPasswordStrength(password) < 2) {
        document.getElementById('reg-password').classList.add('error');
        showError(t('errPasswordWeak'));
        vibrate(20);
        return;
      }
      if (!confirm) {
        document.getElementById('reg-confirm').classList.add('error');
        showError(t('errConfirmRequired'));
        vibrate(20);
        return;
      }
      if (confirm !== password) {
        document.getElementById('reg-confirm').classList.add('error');
        showError(t('errConfirmMismatch'));
        vibrate(20);
        return;
      }
      if (!termsChecked) {
        const row = document.getElementById('terms-row');
        row.classList.add('shake');
        setTimeout(() => row.classList.remove('shake'), 500);
        showError(t('errTermsRequired'));
        vibrate(20);
        return;
      }

      STATE.submitting = true;
      btn.disabled = true;
      btn.classList.add('loading');

      try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;

        // Update profile displayName
        try {
          await user.updateProfile({ displayName: name });
        } catch (e) { console.warn('updateProfile', e); }

        // Create Firestore user doc
        await db.collection('users').doc(user.uid).set({
          uid: user.uid,
          displayName: name,
          email: email,
          walletBalance: 0,
          role: 'client',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        // Optionnel : envoyer email de vérification
        try {
          await user.sendEmailVerification();
        } catch (e) { console.warn('sendEmailVerification', e); }

        vibrate(12);
        showSuccess(t('successRegister'));
        setTimeout(() => { window.location.href = '../index.html'; }, 900);

      } catch (err) {
        console.warn('[Email register]', err.code, err.message);
        showError(mapFirebaseError(err.code));
        vibrate(20);
      } finally {
        STATE.submitting = false;
        btn.disabled = false;
        btn.classList.remove('loading');
      }
    }

    /* Clear error on input */
    document.addEventListener('input', (e) => {
      if (e.target.classList && e.target.classList.contains('text-input')) {
        e.target.classList.remove('error');
        hideError();
      }
    });

    /* Terms checkbox - remove error state */
    document.getElementById('reg-terms')?.addEventListener('change', () => {
      hideError();
    });

    /* Enter key submits (from any input except confirm) */
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && ['reg-name', 'reg-email', 'reg-password', 'reg-confirm'].includes(e.target.id)) {
        e.preventDefault();
        handleEmailRegister(e);
      }
    });

    /* ═══ AUTO-REDIRECT IF ALREADY LOGGED IN ═══ */
    let authResolved = false;
    auth.onAuthStateChanged(user => {
      if (authResolved) return;
      authResolved = true;
      if (user) {
        setTimeout(() => { window.location.href = '../index.html'; }, 300);
      } else {
        document.body.classList.add('ready');
      }
    });

    /* ═══ BOOT ═══ */
    document.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('dp_lang') || 'fr';
      setLang(saved);

      document.addEventListener('click', (e) => {
        const btn = e.target.closest('.btn-google, .btn-submit-register, .btn-secondary-outline, .field-toggle');
        if (btn && !btn.disabled) createRipple(e, btn);
      });

      setTimeout(() => {
        if (!document.body.classList.contains('ready')) {
          document.body.classList.add('ready');
        }
      }, 2500);
    });

    window.addEventListener('error', () => {
      document.body.classList.add('ready');
    });
  </script>
  <script src="/assets/js/design-system.js"></script>
</body>
