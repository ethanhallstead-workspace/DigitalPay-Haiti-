<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#FFFFFF">
<title>Créer un compte — TizèPay</title>
<meta name="description" content="Créez votre compte TizèPay gratuitement.">
<link rel="icon" href="../assets/logo.png">
<link rel="apple-touch-icon" href="../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>(function(){try{
var t=localStorage.getItem('tzp_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
var l=localStorage.getItem('tzp_lang')||((navigator.language||'fr').slice(0,2).toLowerCase());
if(!['fr','ht','en','es'].includes(l))l='fr';
document.documentElement.setAttribute('data-theme',t);
document.documentElement.lang=l;
}catch(e){}})();</script>

<style>
/* ═══════════════════════════════════════════════════════════════════════
   TIZÈPAY — AUTH DESIGN SYSTEM
   ═══════════════════════════════════════════════════════════════════════ */

/* ═════════ 1. TOKENS ═════════ */
:root{
  --blue-25:#F5F8FF;--blue-50:#EBF1FF;--blue-100:#D6E3FF;--blue-200:#ADC6FF;
  --blue-300:#7FA4FF;--blue-400:#3D7BFF;--blue-500:#0055FF;--blue-600:#003ACC;--blue-700:#002A99;
  --blue-soft:rgba(0,85,255,.08);--blue-glow:rgba(0,85,255,.32);--blue-glow-soft:rgba(0,85,255,.16);
  --grad-blue:linear-gradient(135deg,#0055FF 0%,#003ACC 100%);
  --grad-spotlight:linear-gradient(135deg,#0055FF 0%,#3D7BFF 50%,#002A99 100%);

  --green:#00A86B;--green-bg:#ECFDF5;
  --red:#FF3B30;--red-bg:#FEF2F2;
  --amber:#F59E0B;--amber-bg:#FFFBEB;

  --g25:#FCFCFD;--g50:#FAFAFA;--g100:#F4F4F5;--g200:#E4E4E7;
  --g300:#D4D4D8;--g400:#A1A1AA;--g500:#71717A;--g600:#52525B;--g700:#3F3F46;
  --bg:var(--g25);--bg-card:#FFFFFF;--bg-soft:var(--g50);--bg-mute:var(--g100);
  --fg:#0A0A0A;--fg-mute:#52525B;--fg-soft:#8A8A8A;--fg-faint:#B0B0B0;
  --border:#E8E8EC;--border-strong:#D4D4D8;--border-soft:#F0F0F4;

  --r-xs:6px;--r-sm:10px;--r-md:14px;--r-lg:20px;--r-xl:28px;--r-2xl:36px;--r-full:9999px;

  --sh-xs:0 1px 2px rgba(15,15,20,.04);
  --sh-sm:0 2px 6px rgba(15,15,20,.04),0 1px 2px rgba(15,15,20,.02);
  --sh-md:0 8px 20px rgba(15,15,20,.06),0 2px 6px rgba(15,15,20,.03);
  --sh-lg:0 18px 40px rgba(15,15,20,.08),0 6px 14px rgba(15,15,20,.04);
  --sh-xl:0 32px 64px rgba(15,15,20,.12),0 12px 24px rgba(15,15,20,.06);
  --sh-blue:0 8px 24px rgba(0,85,255,.24),0 2px 8px rgba(0,85,255,.12);
  --sh-blue-lg:0 16px 40px rgba(0,85,255,.32),0 4px 12px rgba(0,85,255,.18);

  --ease:cubic-bezier(0.16,1,0.3,1);
  --ease-out:cubic-bezier(0.22,1,0.36,1);
  --spring:cubic-bezier(0.34,1.56,0.64,1);
  --spring-soft:cubic-bezier(0.25,1.5,0.5,1);

  --dur-fast:150ms;--dur:220ms;--dur-slow:320ms;--dur-slower:480ms;
  --t-fast:var(--dur-fast) var(--ease);
  --t:var(--dur) var(--ease);
  --t-slow:var(--dur-slow) var(--ease);
}

html[data-theme="dark"]{
  --bg:#08080A;--bg-card:#141416;--bg-soft:#18181B;--bg-mute:#1E1E22;
  --fg:#F7F7F8;--fg-mute:#A1A1AA;--fg-soft:#71717A;--fg-faint:#4A4A52;
  --border:#26262A;--border-strong:#3F3F46;--border-soft:#1E1E22;
  --blue-soft:rgba(0,85,255,.18);
  --green-bg:#0A1F17;--red-bg:#2A0F0F;--amber-bg:#2A1F0A;
  --sh-xs:0 1px 2px rgba(0,0,0,.5);
  --sh-sm:0 2px 6px rgba(0,0,0,.4);
  --sh-md:0 8px 20px rgba(0,0,0,.5);
  --sh-lg:0 18px 40px rgba(0,0,0,.6);
  --sh-xl:0 32px 64px rgba(0,0,0,.7);
  color-scheme:dark;
}

/* ═════════ 2. BASE ═════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;scroll-behavior:smooth}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:14px;line-height:1.5;color:var(--fg);background:var(--bg);
  min-height:100dvh;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-feature-settings:'cv11','ss01','ss03','tnum';
  transition:background-color .4s var(--ease),color .4s var(--ease);
  overflow-x:hidden;position:relative;
  display:flex;flex-direction:column;
}
img,svg{display:block;max-width:100%;height:auto}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none;transition:color var(--t)}
input,textarea,select{font:inherit;color:inherit;font-family:inherit}
::selection{background:var(--blue-500);color:#FFF}
:focus-visible{outline:2px solid var(--blue-500);outline-offset:3px;border-radius:var(--r-xs)}
::-webkit-scrollbar{width:0;height:0}

/* ═════════ 3. KEYFRAMES ═════════ */
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes shine{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes glowPulse{0%,100%{opacity:.55;filter:blur(40px)}50%{opacity:.85;filter:blur(60px)}}
@keyframes spinner{to{transform:rotate(360deg)}}
@keyframes badgePop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes progressGrow{from{width:0%}to{width:var(--progress-width)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:.9}}

/* ═════════ 4. LAYOUT ═════════ */
.auth-shell{
  min-height:100dvh;
  display:flex;flex-direction:column;
  max-width:480px;margin:0 auto;width:100%;
  position:relative;overflow:hidden;
}

/* Background glow */
.auth-shell::before{
  content:'';position:absolute;top:-160px;right:-120px;
  width:400px;height:400px;
  background:radial-gradient(circle,rgba(0,85,255,.16) 0%,transparent 68%);
  filter:blur(50px);pointer-events:none;
  animation:glowPulse 8s ease-in-out infinite;
}
.auth-shell::after{
  content:'';position:absolute;bottom:-120px;left:-100px;
  width:340px;height:340px;
  background:radial-gradient(circle,rgba(124,58,237,.12) 0%,transparent 68%);
  filter:blur(50px);pointer-events:none;
  animation:glowPulse 10s ease-in-out infinite reverse;
}

/* ═════════ 5. HEADER ═════════ */
.auth-header{
  position:relative;z-index:2;
  padding:20px 20px 0;
  display:flex;align-items:center;justify-content:space-between;
}
.auth-header__back{
  width:40px;height:40px;border-radius:var(--r-md);
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--fg);transition:all var(--t-fast);background:var(--bg-card);
  border:1px solid var(--border-soft);
}
.auth-header__back:hover{background:var(--bg-mute);border-color:var(--border-strong)}
.auth-header__back:active{transform:scale(.92)}
.auth-header__back svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.2;fill:none}

.auth-header__theme{
  width:40px;height:40px;border-radius:var(--r-md);
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--fg);transition:all var(--t-fast);background:var(--bg-card);
  border:1px solid var(--border-soft);position:relative;overflow:hidden;
}
.auth-header__theme:hover{background:var(--bg-mute);border-color:var(--border-strong)}
.auth-header__theme:active{transform:scale(.92)}
.auth-header__theme svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;position:absolute;transition:all var(--dur-slower) var(--spring)}
.auth-header__theme .icon-sun{display:none;transform:rotate(90deg) scale(0)}
.auth-header__theme .icon-moon{display:block;transform:rotate(0) scale(1)}
html[data-theme="dark"] .auth-header__theme .icon-sun{display:block;transform:rotate(0) scale(1)}
html[data-theme="dark"] .auth-header__theme .icon-moon{display:none;transform:rotate(-90deg) scale(0)}

/* ═════════ 6. HERO ═════════ */
.auth-hero{
  position:relative;z-index:2;
  padding:32px 24px 24px;
  text-align:left;
}
.auth-hero__logo{
  width:60px;height:60px;border-radius:var(--r-lg);
  background:var(--grad-blue);
  display:grid;place-items:center;
  box-shadow:var(--sh-blue);
  margin-bottom:20px;
  overflow:hidden;
}
.auth-hero__logo img{width:36px;height:36px;object-fit:contain;filter:brightness(0) invert(1)}
.auth-hero__logo svg{width:28px;height:28px;stroke:#FFF;stroke-width:2.6;fill:none}

.auth-hero__eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 10px;background:var(--bg-card);
  border:1px solid var(--border-soft);
  border-radius:var(--r-full);
  font-size:10.5px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:var(--fg-mute);
  margin-bottom:14px;
}
.auth-hero__eyebrow-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--blue-500);
  box-shadow:0 0 0 3px var(--blue-soft);
}
.auth-hero__title{
  font-size:clamp(28px,7.5vw,34px);
  font-weight:900;letter-spacing:-.045em;
  line-height:1.05;margin-bottom:8px;
  color:var(--fg);
}
.auth-hero__title em{
  font-style:normal;
  background:var(--grad-blue);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  display:inline-block;position:relative;
}
.auth-hero__title em::after{
  content:'';position:absolute;bottom:2px;left:0;right:0;
  height:6px;background:var(--blue-100);z-index:-1;border-radius:3px;
}
.auth-hero__sub{
  font-size:14.5px;color:var(--fg-mute);
  line-height:1.55;max-width:340px;
}

/* Perks */
.auth-perks{
  display:flex;gap:8px;margin-top:16px;
  flex-wrap:wrap;
}
.auth-perk{
  display:inline-flex;align-items:center;gap:5px;
  padding:6px 11px;
  background:var(--bg-card);
  border:1px solid var(--border-soft);
  border-radius:var(--r-full);
  font-size:11px;font-weight:700;
  color:var(--fg-mute);
}
.auth-perk svg{
  width:12px;height:12px;
  stroke:var(--blue-500);stroke-width:2.4;fill:none;flex-shrink:0;
}

/* ═════════ 7. FORM ═════════ */
.auth-form{
  position:relative;z-index:2;
  padding:0 24px;
  flex:1;
  display:flex;flex-direction:column;
  gap:13px;
  animation:slideUp .5s var(--ease-out) both;
  animation-delay:.05s;
}

/* Google button */
.btn-google{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;height:52px;
  background:var(--bg-card);
  border:1.5px solid var(--border);
  border-radius:var(--r-md);
  font-size:14.5px;font-weight:700;
  color:var(--fg);letter-spacing:-.01em;
  transition:all var(--t);position:relative;overflow:hidden;
  box-shadow:var(--sh-xs);
}
.btn-google::before{
  content:'';position:absolute;inset:0;background:var(--fg);
  opacity:0;transition:opacity var(--t-fast);pointer-events:none;
}
.btn-google:hover{border-color:var(--border-strong);box-shadow:var(--sh-sm)}
.btn-google:hover::before{opacity:.03}
.btn-google:active{transform:scale(.98)}
.btn-google svg{width:20px;height:20px;flex-shrink:0}
.btn-google[disabled]{opacity:.6;cursor:not-allowed}

/* Divider */
.auth-divider{
  display:flex;align-items:center;gap:12px;
  margin:4px 0;
}
.auth-divider::before,
.auth-divider::after{
  content:'';flex:1;height:1px;background:var(--border-soft);
}
.auth-divider span{
  font-size:11px;font-weight:700;
  color:var(--fg-soft);
  letter-spacing:.06em;text-transform:uppercase;
}

/* Field */
.field{
  display:flex;flex-direction:column;gap:6px;
  position:relative;
}
.field label{
  font-size:12.5px;font-weight:700;color:var(--fg);
  letter-spacing:-.01em;
}
.field__wrap{position:relative}
.field__icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--fg-soft);pointer-events:none;
  transition:color var(--t);
  display:grid;place-items:center;
}
.field__icon svg{width:17px;height:17px;stroke:currentColor;stroke-width:2.2;fill:none}
.field input{
  width:100%;height:52px;
  padding:0 46px 0 44px;
  background:var(--bg-mute);
  border:1.5px solid transparent;
  border-radius:var(--r-md);
  font-size:14.5px;font-weight:600;
  color:var(--fg);outline:none;
  transition:all .22s var(--ease);
}
.field input::placeholder{color:var(--fg-faint);font-weight:500}
.field input:focus{background:var(--bg-card);border-color:var(--blue-500);box-shadow:0 0 0 4px var(--blue-soft)}
.field input:focus ~ .field__icon{color:var(--blue-500)}
.field input.is-valid{border-color:var(--green)}
.field input.is-invalid{border-color:var(--red);background:var(--red-bg);animation:shake .35s}
.field__error{
  font-size:11px;font-weight:700;color:var(--red);
  margin-top:2px;display:none;
}
.field__error.is-on{display:block}

/* Password toggle */
.field__toggle{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:36px;height:36px;border-radius:var(--r-sm);
  display:grid;place-items:center;
  color:var(--fg-soft);cursor:pointer;
  transition:all var(--t-fast);
}
.field__toggle:hover{background:var(--bg-mute);color:var(--fg-mute)}
.field__toggle:active{transform:translateY(-50%) scale(.9)}
.field__toggle svg{width:17px;height:17px;stroke:currentColor;stroke-width:2.2;fill:none}
.field__toggle .eye-off{display:none}
.field__toggle.is-on .eye-on{display:none}
.field__toggle.is-on .eye-off{display:block}

/* Password strength meter */
.strength{
  margin-top:2px;
  display:none;
}
.strength.is-on{display:block}
.strength__bars{
  display:flex;gap:4px;margin-bottom:6px;
}
.strength__bar{
  flex:1;height:4px;
  background:var(--bg-mute);
  border-radius:var(--r-full);
  transition:background .3s var(--ease);
}
.strength[data-level="1"] .strength__bar:nth-child(1){background:var(--red)}
.strength[data-level="2"] .strength__bar:nth-child(1),
.strength[data-level="2"] .strength__bar:nth-child(2){background:var(--amber)}
.strength[data-level="3"] .strength__bar:nth-child(1),
.strength[data-level="3"] .strength__bar:nth-child(2),
.strength[data-level="3"] .strength__bar:nth-child(3){background:#3D7BFF}
.strength[data-level="4"] .strength__bar{background:var(--green)}
.strength__label{
  display:flex;align-items:center;justify-content:space-between;
  font-size:11px;font-weight:700;
  color:var(--fg-soft);
}
.strength__label-value{
  font-weight:800;
  transition:color .3s var(--ease);
}
.strength[data-level="1"] .strength__label-value{color:var(--red)}
.strength[data-level="2"] .strength__label-value{color:var(--amber)}
.strength[data-level="3"] .strength__label-value{color:#3D7BFF}
.strength[data-level="4"] .strength__label-value{color:var(--green)}

/* Confirm match indicator */
.match-indicator{
  position:absolute;right:14px;top:50%;
  transform:translateY(-50%);
  display:none;align-items:center;justify-content:center;
  width:20px;height:20px;border-radius:50%;
}
.match-indicator.is-ok{
  display:flex;background:var(--green);
  animation:badgePop .35s var(--spring);
}
.match-indicator.is-ko{
  display:flex;background:var(--red);
  animation:badgePop .35s var(--spring);
}
.match-indicator svg{width:11px;height:11px;stroke:#FFF;stroke-width:3;fill:none}

/* Checkbox */
.checkbox{
  display:flex;align-items:flex-start;gap:10px;
  cursor:pointer;font-size:13px;font-weight:500;
  color:var(--fg-mute);user-select:none;
  line-height:1.5;
}
.checkbox input{
  position:absolute;opacity:0;pointer-events:none;
}
.checkbox__box{
  width:20px;height:20px;border-radius:6px;
  border:1.5px solid var(--border-strong);
  background:var(--bg-card);
  display:grid;place-items:center;
  transition:all var(--t-fast);
  flex-shrink:0;margin-top:1px;
}
.checkbox__box svg{
  width:12px;height:12px;stroke:#FFF;stroke-width:3.2;fill:none;
  stroke-dasharray:50;stroke-dashoffset:50;
  transition:stroke-dashoffset .3s var(--ease-out);
}
.checkbox input:checked ~ .checkbox__box{
  background:var(--blue-500);border-color:var(--blue-500);
}
.checkbox input:checked ~ .checkbox__box svg{
  stroke-dashoffset:0;
}
.checkbox:hover .checkbox__box{border-color:var(--blue-500)}
.checkbox.is-invalid .checkbox__box{
  border-color:var(--red);background:var(--red-bg);
  animation:shake .35s;
}
.checkbox__link{
  color:var(--blue-600);font-weight:700;
  transition:color var(--t-fast);
}
.checkbox__link:hover{color:var(--blue-700);text-decoration:underline}

/* Submit button */
.btn-submit{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;height:54px;
  background:var(--blue-500);color:#FFF;
  border-radius:var(--r-md);
  font-size:15px;font-weight:800;
  letter-spacing:-.01em;
  transition:all var(--t);position:relative;overflow:hidden;
  box-shadow:var(--sh-blue);
  margin-top:6px;
}
.btn-submit::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);
  background-size:200% 100%;opacity:0;
}
.btn-submit:hover:not(:disabled){background:var(--blue-600);box-shadow:var(--sh-blue-lg)}
.btn-submit:hover:not(:disabled)::after{opacity:1;animation:shine 1.5s linear infinite}
.btn-submit:active:not(:disabled){transform:scale(.98)}
.btn-submit:disabled{opacity:.6;cursor:not-allowed}
.btn-submit svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.4;fill:none}
.btn-submit__spinner{
  display:none;width:18px;height:18px;
  border:2.5px solid rgba(255,255,255,.3);
  border-top-color:#FFF;border-radius:50%;
  animation:spinner .7s linear infinite;
}
.btn-submit.is-loading .btn-submit__spinner{display:block}
.btn-submit.is-loading .btn-submit__text,
.btn-submit.is-loading svg{display:none}

/* Alert box */
.alert{
  display:none;
  padding:12px 14px;
  border-radius:var(--r-md);
  font-size:13px;font-weight:600;
  line-height:1.5;
  align-items:flex-start;gap:10px;
  animation:slideUp .3s var(--ease-out);
}
.alert.is-on{display:flex}
.alert--danger{
  background:var(--red-bg);color:var(--red);
  border:1px solid rgba(255,59,48,.25);
}
.alert--success{
  background:var(--green-bg);color:var(--green);
  border:1px solid rgba(0,168,107,.25);
}
.alert svg{
  width:16px;height:16px;stroke:currentColor;
  stroke-width:2.4;fill:none;flex-shrink:0;margin-top:1px;
}

/* Login link */
.auth-footer{
  position:relative;z-index:2;
  padding:24px 24px calc(24px + env(safe-area-inset-bottom,0));
  text-align:center;
  margin-top:auto;
}
.auth-footer__text{
  font-size:13.5px;font-weight:600;
  color:var(--fg-mute);
}
.auth-footer__link{
  font-weight:800;color:var(--blue-600);
  margin-left:4px;
  transition:color var(--t-fast);
  cursor:pointer;
}
.auth-footer__link:hover{color:var(--blue-700);text-decoration:underline}

/* Trust strip */
.auth-trust{
  position:relative;z-index:2;
  padding:0 24px 20px;
  display:flex;align-items:center;justify-content:center;
  gap:20px;flex-wrap:wrap;
}
.auth-trust__item{
  display:inline-flex;align-items:center;gap:6px;

/* ═════════ 8. TOAST ═════════ */
.toasts{

  z-index:999;display:flex;flex-direction:column;gap:8px;
  width:calc(100% - 32px);max-width:400px;pointer-events:none;
}
.toast{
  padding:14px 16px;border-radius:var(--r-md);
  background:var(--fg);color:var(--bg);
  font-size:13px;font-weight:600;letter-spacing:-.01em;
  display:flex;align-items:center;gap:10px;
  box-shadow:var(--sh-xl);pointer-events:all;
  animation:slideUp .4s var(--spring);
  position:relative;overflow:hidden;line-height:1.4;
}
.toast::after{
  content:'';position:absolute;bottom:0;left:0;
  height:2px;width:100%;background:var(--blue-400);
  transform-origin:left;
  animation:progressBar 2.6s linear forwards;
}
.toast--success::after{background:var(--green)}
.toast--danger::after{background:var(--red)}
.toast--warning::after{background:var(--amber)}
@keyframes progressBar{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* ═════════ 9. UTILS ═════════ */
.hidden{display:none!important}

    err_password_required:'Ingresa una contraseña',
    err_password_short:'Mínimo 6 caracteres',
    err_password_weak:'Contraseña muy débil',
    err_confirm_required:'Confirma tu contraseña',
    err_confirm_mismatch:'Las contraseñas no coinciden',
    err_terms_required:'Debes aceptar los términos',
    err_email_in_use:'Este correo ya está en uso',
    err_weak_password:'Contraseña muy débil',
    err_invalid_email:'Correo inválido',
    err_too_many:'Demasiados intentos. Intenta más tarde.',
    err_network:'Error de red. Verifica tu conexión.',
    err_generic:'Ocurrió un error. Intenta de nuevo.',
    err_google_cancelled:'Registro Google cancelado',
    err_google_popup:'Popup bloqueado. Permite popups.',
    err_google_popup_closed:'Registro interrumpido.',
    success_created:'¡Cuenta creada! Revisa tu correo.',
    success_google:'Cuenta de Google creada',
    toast_welcome:'Bienvenido a TizèPay'
  }
};

const t = key => (I18N[STATE.lang] && I18N[STATE.lang][key]) || I18N.fr[key] || key;

function applyTranslations(){
  document.documentElement.lang = STATE.lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t(el.dataset.i18n);
    if(v) el.textContent = v;
  });
}

/* ═════════ THEME ═════════ */
const Theme = {
  KEY:'tzp_theme',
  sys(){ return matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'; },
  stored(){ try{ return localStorage.getItem(this.KEY); }catch(e){ return null; } },
  apply(th, anim=true){
    const r = document.documentElement;
    if(anim){ r.style.transition = 'background-color .4s ease, color .4s ease'; setTimeout(()=>r.style.transition='', 420); }
    r.setAttribute('data-theme', th);
    const m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', th === 'dark' ? '#08080A' : '#FFFFFF');
  },
  set(th){ try{ localStorage.setItem(this.KEY, th); }catch(e){} this.apply(th); },
  toggle(){ Haptic.light(); this.set(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); }
};
Theme.apply(Theme.stored() || Theme.sys(), false);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change', e => { if(!Theme.stored()) Theme.apply(e.matches ? 'dark' : 'light'); });

/* ═════════ TOAST ═════════ */
function toast(msg, type='success'){
  const wrap = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast toast--' + type;
  el.textContent = msg;
  wrap.innerHTML = '';
  wrap.appendChild(el);
  setTimeout(()=>{
    el.style.transition = 'opacity .3s, transform .3s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(-12px) scale(.95)';
    setTimeout(()=>el.remove(), 320);
  }, 2600);
}

/* ═════════ ALERT ═════════ */
function showAlert(message){
  const box = document.getElementById('alertBox');
  const msg = document.getElementById('alertMessage');
  msg.textContent = message;
  box.classList.add('is-on');
  Haptic.error();
  box.scrollIntoView({ behavior:'smooth', block:'center' });
}
function hideAlert(){
  document.getElementById('alertBox').classList.remove('is-on');
}

/* ═════════ VALIDATORS ═════════ */
const Validators = {
  name(v){
    v = String(v||'').trim();
    if(!v) return t('err_name_required');
    if(v.length < 2) return t('err_name_short');
    return null;
  },
  email(v){
    v = String(v||'').trim();
    if(!v) return t('err_email_required');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return t('err_email_invalid');
    return null;
  },
  password(v){
    v = String(v||'');
    if(!v) return t('err_password_required');
    if(v.length < 6) return t('err_password_short');
    return null;
  },
  confirm(v, original){
    v = String(v||'');
    if(!v) return t('err_confirm_required');
    if(v !== original) return t('err_confirm_mismatch');
    return null;
  }
};

/* ═════════ PASSWORD STRENGTH ═════════ */
function computeStrength(password){
  if(!password) return 0;
  let score = 0;
  if(password.length >= 6) score++;
  if(password.length >= 10) score++;
  const hasLower = /[a-z]/.test(password);
  const hasUpper = /[A-Z]/.test(password);
  const hasDigit = /\d/.test(password);
  const hasSymbol = /[^A-Za-z0-9]/.test(password);
  const variety = [hasLower, hasUpper, hasDigit, hasSymbol].filter(Boolean).length;
  if(variety >= 2) score++;
  if(variety >= 3 && password.length >= 8) score++;
  return Math.min(4, score);
}

function strengthLabel(level){
  switch(level){
    case 1: return t('strength_weak');
    case 2: return t('strength_fair');
    case 3: return t('strength_good');
    case 4: return t('strength_strong');
    default: return t('strength_none');
  }
}

function updateStrengthUI(password){
  const el = document.getElementById('strength');
  const valEl = document.getElementById('strengthValue');
  if(!password){
    el.classList.remove('is-on');
    el.dataset.level = '0';
    return;
  }
  el.classList.add('is-on');
  const level = computeStrength(password);
  el.dataset.level = level;
  valEl.textContent = strengthLabel(level);
}

/* ═════════ FIELD ERROR ═════════ */
function setFieldError(inputId, errorId, message){
  const input = document.getElementById(inputId);
  const errEl = document.getElementById(errorId);
  if(message){
    input.classList.add('is-invalid');
    input.classList.remove('is-valid');
    errEl.textContent = message;
    errEl.classList.add('is-on');
  } else {
    input.classList.remove('is-invalid');
    input.classList.add('is-valid');
    errEl.textContent = '';
    errEl.classList.remove('is-on');
  }
}

/* ═════════ FIREBASE ERROR MAPPING ═════════ */
function mapFirebaseError(code){
  switch(code){
    case 'auth/email-already-in-use': return t('err_email_in_use');
    case 'auth/weak-password': return t('err_weak_password');
    case 'auth/invalid-email': return t('err_invalid_email');
    case 'auth/too-many-requests': return t('err_too_many');
    case 'auth/network-request-failed': return t('err_network');
    case 'auth/popup-closed-by-user': return t('err_google_popup_closed');
    case 'auth/cancelled-popup-request': return t('err_google_cancelled');
    case 'auth/popup-blocked': return t('err_google_popup');
    default: return t('err_generic');
  }
}

/* ═════════ ELEMENTS ═════════ */
const form = document.getElementById('registerForm');
const submitBtn = document.getElementById('submitBtn');
const fullnameInput = document.getElementById('fullname');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const confirmInput = document.getElementById('confirm');
const termsInput = document.getElementById('terms');
const termsLabel = document.getElementById('termsLabel');
const matchIndicator = document.getElementById('matchIndicator');

/* ═════════ LIVE VALIDATION ═════════ */
fullnameInput.addEventListener('blur', ()=>{
  if(fullnameInput.value.trim()) setFieldError('fullname','fullnameError', Validators.name(fullnameInput.value));
});
fullnameInput.addEventListener('input', ()=>{
  if(fullnameInput.classList.contains('is-invalid')){
    if(!Validators.name(fullnameInput.value)) setFieldError('fullname','fullnameError', null);
  }
});

emailInput.addEventListener('blur', ()=>{
  if(emailInput.value.trim()) setFieldError('email','emailError', Validators.email(emailInput.value));
});
emailInput.addEventListener('input', ()=>{
  if(emailInput.classList.contains('is-invalid')){
    if(!Validators.email(emailInput.value)) setFieldError('email','emailError', null);
  }
});

passwordInput.addEventListener('input', ()=>{
  updateStrengthUI(passwordInput.value);
  if(passwordInput.classList.contains('is-invalid')){
    if(!Validators.password(passwordInput.value)) setFieldError('password','passwordError', null);
  }
  /* Live check confirm match */
  if(confirmInput.value){
    checkConfirmMatch();
  }
});
passwordInput.addEventListener('blur', ()=>{
  if(passwordInput.value) setFieldError('password','passwordError', Validators.password(passwordInput.value));
});

confirmInput.addEventListener('input', ()=>{
  if(confirmInput.value || confirmInput.classList.contains('is-invalid')){
    checkConfirmMatch();
  }
});
confirmInput.addEventListener('blur', ()=>{
  if(confirmInput.value) checkConfirmMatch();
});

function checkConfirmMatch(){
  const pwd = passwordInput.value;
  const cnf = confirmInput.value;
  if(!cnf){
    matchIndicator.className = 'match-indicator';
    return;
  }
  if(cnf === pwd){
    matchIndicator.className = 'match-indicator is-ok';
    matchIndicator.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
    if(confirmInput.classList.contains('is-invalid')){
      setFieldError('confirm','confirmError', null);
    }
  } else {
    matchIndicator.className = 'match-indicator is-ko';
    matchIndicator.innerHTML = '<svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>';
    setFieldError('confirm','confirmError', t('err_confirm_mismatch'));
  }
}

/* Terms */
termsInput.addEventListener('change', ()=>{
  if(termsInput.checked){
    termsLabel.classList.remove('is-invalid');
  }
});

/* ═════════ PASSWORD TOGGLE ═════════ */
document.getElementById('togglePassword').addEventListener('click', ()=>{
  const btn = document.getElementById('togglePassword');
  const isPassword = passwordInput.type === 'password';
  const newType = isPassword ? 'text' : 'password';
  passwordInput.type = newType;
  /* sync confirm type */
  confirmInput.type = newType;
  btn.classList.toggle('is-on', isPassword);
  Haptic.light();
});

/* ═════════ THEME BUTTON ═════════ */
document.getElementById('themeBtn').addEventListener('click', ()=>Theme.toggle());

/* ═════════ SUBMIT ═════════ */
form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  hideAlert();

  const fullname = fullnameInput.value.trim();
  const email = emailInput.value.trim();
  const password = passwordInput.value;
  const confirm = confirmInput.value;
  const terms = termsInput.checked;

  /* Validate all */
  const nameErr = Validators.name(fullname);
  const emailErr = Validators.email(email);
  const pwdErr = Validators.password(password);
  const cnfErr = Validators.confirm(confirm, password);

  setFieldError('fullname','fullnameError', nameErr);
  setFieldError('email','emailError', emailErr);
  setFieldError('password','passwordError', pwdErr);
  setFieldError('confirm','confirmError', cnfErr);
  termsLabel.classList.toggle('is-invalid', !terms);

  if(nameErr || emailErr || pwdErr || cnfErr || !terms){
    if(!terms) showAlert(t('err_terms_required'));
    return;
  }

  if(!fbAuth || !fbDb){
    showAlert(t('err_generic'));
    return;
  }

  submitBtn.classList.add('is-loading');
  submitBtn.disabled = true;
  Haptic.light();

  try {
    /* Create auth user */
    const cred = await fbAuth.createUserWithEmailAndPassword(email, password);

    /* Update displayName */
    await cred.user.updateProfile({ displayName: fullname });

    /* Create Firestore user doc */
    await fbDb.collection('users').doc(cred.user.uid).set({
      uid: cred.user.uid,
      displayName: fullname,
      email: email,
      walletBalance: 0,
      role: 'client',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    /* Send email verification (optional but good) */
    try { await cred.user.sendEmailVerification(); } catch(e){}

    toast(t('success_created'), 'success');
    setTimeout(()=>{ window.location.href = '../index.html'; }, 1200);
  } catch(err){
    console.error('[Register]', err);
    showAlert(mapFirebaseError(err.code));
  } finally {
    submitBtn.classList.remove('is-loading');
    submitBtn.disabled = false;
  }
});

/* ═════════ GOOGLE SIGN-UP ═════════ */
document.getElementById('googleBtn').addEventListener('click', async ()=>{
  if(!fbAuth || !fbDb){
    showAlert(t('err_generic'));
    return;
  }
  hideAlert();
  Haptic.light();
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  try {
    await fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    const result = await fbAuth.signInWithPopup(provider);
    if(result && result.user){
      const ref = fbDb.collection('users').doc(result.user.uid);
      const snap = await ref.get();
      if(!snap.exists){
        await ref.set({
          uid: result.user.uid,
          displayName: result.user.displayName || '',
          email: result.user.email || '',
          walletBalance: 0,
          role: 'client',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
    }
    toast(t('success_google'), 'success');
    setTimeout(()=>{ window.location.href = '../index.html'; }, 1000);
  } catch(err){
    console.error('[Google]', err);
    if(err.code !== 'auth/popup-closed-by-user'){
      showAlert(mapFirebaseError(err.code));
    }
  }
});

/* ═════════ INIT ═════════ */
applyTranslations();

})();
</script>
</body>
</html>
