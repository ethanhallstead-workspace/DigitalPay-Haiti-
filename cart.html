<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#00B4FF">
  <script>(function(){try{var t=localStorage.getItem('dp_theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <title>Mon Panier — DigitalPay Haiti</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/assets/site.webmanifest">

  <style>
    :root {
      /* Palette v8 — dérivée du logo 2026 (cyan → bleu profond) */
      --bg-page: #F5F7FB; --bg-card: #FFFFFF; --bg-subtle: #F0F4F9; --bg-hover: #F8FAFC;
      --bg-glass: rgba(245, 247, 251, 0.72);
      --border-subtle: #EDF1F7; --border-default: #E1E8F0; --border-strong: #C7D2E0;
      --text-primary: #0A1633; --text-secondary: #4A5568; --text-tertiary: #8B94A7; --text-quaternary: #B5BDCA;
      --blue-25: #F0F9FF; --blue-50: #E0F2FE; --blue-100: #BAE6FD; --blue-200: #7DD3FC;
      --blue-400: #38BDF8; --blue-500: #00B4FF; --blue-600: #0055FF; --blue-700: #003BCC;
      --blue-gradient: linear-gradient(135deg, #00B4FF 0%, #0055FF 100%);
      --success: #059669; --success-bg: #ECFDF5; --success-border: #A7F3D0;
      --danger: #DC2626; --danger-bg: #FEF2F2; --danger-border: #FECACA;
      --warning: #D97706; --warning-bg: #FFFBEB;
      --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px; --r-2xl: 28px; --r-3xl: 36px; --r-full: 9999px;
      --shadow-2xs: 0 1px 1px rgba(10, 22, 51, 0.03);
      --shadow-xs: 0 1px 2px rgba(10, 22, 51, 0.04), 0 1px 1px rgba(10, 22, 51, 0.02);
      --shadow-sm: 0 2px 4px rgba(10, 22, 51, 0.04), 0 1px 2px rgba(10, 22, 51, 0.03);
      --shadow-md: 0 4px 8px rgba(10, 22, 51, 0.05), 0 2px 4px rgba(10, 22, 51, 0.03);
      --shadow-lg: 0 8px 16px rgba(10, 22, 51, 0.06), 0 4px 8px rgba(10, 22, 51, 0.04);
      --shadow-xl: 0 16px 32px rgba(10, 22, 51, 0.08), 0 8px 16px rgba(10, 22, 51, 0.04);
      --shadow-2xl: 0 28px 56px rgba(10, 22, 51, 0.12), 0 12px 24px rgba(10, 22, 51, 0.06);
      --shadow-blue: 0 4px 12px rgba(0, 85, 255, 0.22), 0 10px 28px rgba(0, 85, 255, 0.14);
      --shadow-blue-lg: 0 8px 20px rgba(0, 85, 255, 0.28), 0 16px 40px rgba(0, 85, 255, 0.16);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body { background: var(--bg-page); color: var(--text-primary); font-family: var(--font); font-size: 14px; line-height: 1.5; overflow-x: hidden; min-height: 100vh; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; opacity: 0; transition: opacity 0.4s ease; padding-bottom: 90px; }
    body.ready { opacity: 1; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 3px; }

    .app-shell { width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg-page); position: relative; display: flex; flex-direction: column; border-left: 1px solid var(--border-subtle); border-right: 1px solid var(--border-subtle); }
    .icon-svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; display: inline-block; vertical-align: middle; }

    .site-header { position: sticky; top: 0; z-index: 40; background: var(--bg-glass); backdrop-filter: saturate(180%) blur(24px); -webkit-backdrop-filter: saturate(180%) blur(24px); border-bottom: 1px solid transparent; padding: 14px 18px; transition: all 0.3s var(--ease-out); }
    .site-header.scrolled { border-bottom-color: var(--border-subtle); padding: 10px 18px; box-shadow: var(--shadow-xs); }
    .header-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
    .brand-logo { height: 32px; width: auto; max-width: 130px; object-fit: contain; cursor: pointer; display: block; transition: all 0.3s var(--ease-out); }
    .site-header.scrolled .brand-logo { height: 28px; }
    .header-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .icon-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--border-default); display: flex; align-items: center; justify-content: center; color: var(--text-primary); cursor: pointer; position: relative; text-decoration: none; transition: all 0.2s var(--ease-out); box-shadow: var(--shadow-2xs); flex-shrink: 0; }
    .icon-btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }
    .icon-btn:active { transform: scale(0.9); }
    .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; }
    .cart-badge { position: absolute; top: -3px; right: -3px; background: var(--blue-gradient); color: #FFFFFF; font-size: 10px; font-weight: 800; min-width: 19px; height: 19px; padding: 0 5px; border-radius: var(--r-full); display: none; align-items: center; justify-content: center; box-shadow: 0 0 0 2px var(--bg-page); line-height: 1; }
    .cart-badge.visible { display: flex; }

    .cart-main { padding: 22px 18px 24px; flex: 1; }

    .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .page-title { font-size: 24px; font-weight: 900; color: var(--text-primary); letter-spacing: -0.7px; line-height: 1.15; }
    .page-count { background: var(--bg-subtle); border: 1px solid var(--border-subtle); color: var(--blue-600); font-size: 11.5px; font-weight: 800; padding: 4px 10px; border-radius: var(--r-full); white-space: nowrap; }

    .cart-items-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 22px; }
    .cart-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--r-xl); padding: 14px; display: flex; gap: 12px; box-shadow: var(--shadow-xs); transition: all 0.25s var(--ease-out); position: relative; overflow: hidden; }
    .cart-card:hover { border-color: var(--border-default); box-shadow: var(--shadow-sm); }
    .cart-thumb { width: 56px; height: 56px; border-radius: var(--r-md); overflow: hidden; background: linear-gradient(135deg, var(--bg-subtle) 0%, #E8EEF7 100%); border: 1px solid var(--border-subtle); flex-shrink: 0; display: flex; align-items: center; justify-content: center; position: relative; }
    .cart-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .cart-thumb-fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; color: var(--text-quaternary); text-transform: uppercase; letter-spacing: -0.5px; }
    .cart-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .cart-prod-title { font-size: 14px; font-weight: 800; color: var(--text-primary); line-height: 1.25; letter-spacing: -0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cart-prod-offer { font-size: 12px; color: var(--text-secondary); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cart-prod-deliv { font-size: 11px; color: var(--blue-600); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--blue-50); padding: 3px 8px; border-radius: var(--r-full); display: inline-block; max-width: 100%; align-self: flex-start; }
    .cart-prod-price { font-size: 15px; font-weight: 900; color: var(--text-primary); letter-spacing: -0.3px; margin-top: 2px; }
    .cart-remove { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 50%; background: var(--bg-subtle); border: 1px solid var(--border-subtle); color: var(--text-tertiary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s ease; font-family: inherit; }
    .cart-remove:hover { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-border); }
    .cart-remove:active { transform: scale(0.9); }
    .cart-remove svg { width: 13px; height: 13px; stroke: currentColor; stroke-width: 2.4; fill: none; }

    .empty-cart { text-align: center; padding: 60px 24px; display: flex; flex-direction: column; align-items: center; }
    .empty-cart-icon { width: 80px; height: 80px; border-radius: 50%; background: var(--bg-subtle); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    .empty-cart-icon svg { width: 36px; height: 36px; stroke: var(--text-tertiary); stroke-width: 1.8; fill: none; }
    .empty-cart-title { font-size: 18px; font-weight: 900; color: var(--text-primary); margin-bottom: 6px; letter-spacing: -0.3px; }
    .empty-cart-sub { font-size: 13px; color: var(--text-secondary); max-width: 280px; margin: 0 auto 24px; line-height: 1.5; }
    .empty-cart-btn { background: var(--blue-gradient); color: #FFFFFF; padding: 14px 28px; border-radius: var(--r-md); font-size: 14px; font-weight: 800; text-decoration: none; box-shadow: var(--shadow-blue); display: inline-flex; align-items: center; gap: 8px; font-family: inherit; transition: all 0.2s ease; }
    .empty-cart-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-blue-lg); }
    .empty-cart-btn svg { width: 16px; height: 16px; stroke: #FFFFFF; stroke-width: 2.2; fill: none; }

    .section-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--r-xl); padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow-xs); }
    .section-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.7px; color: var(--text-primary); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .section-title svg { width: 16px; height: 16px; stroke: var(--blue-600); stroke-width: 2.2; fill: none; }

    .payment-methods { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .pay-pill { background: var(--bg-card); border: 1.5px solid var(--border-default); border-radius: var(--r-md); padding: 12px 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: all 0.2s var(--ease-out); position: relative; font-family: inherit; }
    .pay-pill:active { transform: scale(0.98); }
    .pay-pill.active { border-color: var(--blue-600); background: var(--blue-50); box-shadow: 0 0 0 1px var(--blue-600); }
    .pay-pill-logo { width: 40px; height: 40px; border-radius: var(--r-sm); background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; border: 1px solid var(--border-subtle); }
    .pay-pill-logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .pay-pill-logo-fallback { font-size: 13px; font-weight: 900; letter-spacing: -0.3px; }
    .pay-pill-name { font-size: 12.5px; font-weight: 700; color: var(--text-primary); line-height: 1.2; }
    .pay-pill.active .pay-pill-name { color: var(--blue-700); font-weight: 800; }
    .pay-pill-check { position: absolute; top: 6px; right: 6px; width: 15px; height: 15px; border-radius: 50%; background: var(--blue-600); display: none; align-items: center; justify-content: center; }
    .pay-pill-check svg { width: 9px; height: 9px; stroke: #FFFFFF; stroke-width: 3; fill: none; }
    .pay-pill.active .pay-pill-check { display: flex; }

    .wallet-info-row { margin-top: 14px; padding: 14px; background: var(--blue-50); border: 1px solid var(--blue-100); border-radius: var(--r-md); display: flex; align-items: center; gap: 12px; }
    .wallet-info-icon { width: 34px; height: 34px; border-radius: 50%; background: var(--blue-gradient); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .wallet-info-icon svg { width: 16px; height: 16px; stroke: #FFFFFF; stroke-width: 2.2; fill: none; }
    .wallet-info-text { flex: 1; min-width: 0; }
    .wallet-info-label { font-size: 11px; font-weight: 700; color: var(--blue-700); text-transform: uppercase; letter-spacing: 0.4px; }
    .wallet-info-value { font-size: 17px; font-weight: 900; color: var(--blue-700); letter-spacing: -0.4px; margin-top: 1px; }

    .pay-instructions { margin-top: 14px; padding: 14px; background: var(--bg-subtle); border: 1px solid var(--border-subtle); border-radius: var(--r-md); }
    .pay-instr-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .pay-instr-label { font-size: 11.5px; font-weight: 800; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.4px; }
    .btn-copy-inline { background: #FFFFFF; border: 1px solid var(--border-default); color: var(--blue-600); font-size: 11.5px; font-weight: 800; padding: 5px 11px; border-radius: var(--r-sm); cursor: pointer; display: flex; align-items: center; gap: 5px; font-family: inherit; transition: all 0.15s ease; }
    .btn-copy-inline:hover { background: var(--blue-50); border-color: var(--blue-200); }
    .btn-copy-inline:active { transform: scale(0.96); }
    .btn-copy-inline svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2.2; fill: none; }
    .pay-instr-value { font-family: monospace; font-size: 15px; font-weight: 900; color: var(--text-primary); margin-bottom: 4px; word-break: break-all; letter-spacing: 0.3px; }
    .pay-instr-hint { font-size: 11px; color: var(--text-tertiary); font-weight: 600; }

    .field { display: flex; flex-direction: column; gap: 7px; margin-top: 12px; }
    .field-label { font-size: 11.5px; font-weight: 800; color: var(--text-primary); text-transform: uppercase; letter-spacing: 0.4px; }
    .text-input { width: 100%; height: 46px; background: var(--bg-subtle); border: 1.5px solid transparent; border-radius: var(--r-md); padding: 0 14px; font-size: 14px; font-weight: 600; color: var(--text-primary); outline: none; font-family: inherit; transition: all 0.2s ease; }
    .text-input:focus { background: var(--bg-card); border-color: var(--blue-600); box-shadow: 0 0 0 4px var(--blue-50); }
    .text-input::placeholder { color: var(--text-quaternary); font-weight: 500; }

    .file-upload { position: relative; margin-top: 4px; }
    .file-upload-input { position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 2; }
    .file-upload-box { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--bg-subtle); border: 1.5px dashed var(--border-strong); border-radius: var(--r-md); transition: all 0.2s ease; }
    .file-upload-box:hover { background: var(--bg-hover); border-color: var(--blue-400); }
    .file-upload-icon { width: 36px; height: 36px; border-radius: 50%; background: var(--blue-50); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .file-upload-icon svg { width: 17px; height: 17px; stroke: var(--blue-600); stroke-width: 2.2; fill: none; }
    .file-upload-text { flex: 1; min-width: 0; }
    .file-upload-title { font-size: 12.5px; font-weight: 800; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-upload-sub { font-size: 11px; color: var(--text-tertiary); font-weight: 600; margin-top: 2px; }

    .wallet-alert { padding: 14px; background: var(--danger-bg); border: 1px solid var(--danger-border); border-radius: var(--r-md); margin-top: 14px; display: none; }
    .wallet-alert.visible { display: block; }
    .wallet-alert-text { font-size: 12.5px; font-weight: 700; color: var(--danger); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .wallet-alert-text svg { width: 15px; height: 15px; stroke: var(--danger); stroke-width: 2.4; fill: none; flex-shrink: 0; }
    .btn-topup { display: inline-flex; align-items: center; gap: 6px; background: var(--text-primary); color: #FFFFFF; padding: 9px 14px; border-radius: var(--r-sm); font-size: 12px; font-weight: 800; text-decoration: none; font-family: inherit; transition: transform 0.15s ease; }
    .btn-topup:active { transform: scale(0.97); }
    .btn-topup svg { width: 13px; height: 13px; stroke: #FFFFFF; stroke-width: 2.2; fill: none; }

    .summary-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; font-size: 13px; font-weight: 600; color: var(--text-secondary); }
    .summary-row.divider { border-top: 1px solid var(--border-subtle); margin-top: 4px; padding-top: 14px; }
    .summary-row.total { font-size: 15px; font-weight: 900; color: var(--text-primary); }
    .summary-row.total span:last-child { font-size: 20px; color: var(--blue-600); letter-spacing: -0.5px; }

    .btn-submit-order { width: 100%; height: 56px; background: var(--blue-gradient); color: #FFFFFF; border: none; border-radius: var(--r-md); font-size: 15px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: inherit; box-shadow: var(--shadow-blue); transition: all 0.2s var(--ease-out); letter-spacing: -0.2px; margin-top: 18px; position: relative; overflow: hidden; }
    .btn-submit-order:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0, 85, 255, 0.3), 0 14px 32px rgba(0, 85, 255, 0.18); }
    .btn-submit-order:active { transform: scale(0.985); }
    .btn-submit-order:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; }
    .btn-submit-order .spinner { width: 20px; height: 20px; border: 2.5px solid rgba(255,255,255,0.3); border-top-color: #FFFFFF; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
    .btn-submit-order.loading .spinner { display: block; }
    .btn-submit-order.loading .btn-label { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .trust-strip { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 18px; font-size: 11px; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.4px; }
    .trust-strip-item { display: flex; align-items: center; gap: 5px; }
    .trust-strip-item svg { width: 12px; height: 12px; stroke: var(--success); stroke-width: 2.4; fill: none; }

    .ripple { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.5); transform: scale(0); animation: ripple-anim 0.6s var(--ease-out); pointer-events: none; }
    @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }

    .site-footer { background: var(--bg-card); border-top: 1px solid var(--border-subtle); padding: 18px; }
    .footer-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; color: var(--text-tertiary); gap: 12px; }
    .footer-status { display: flex; align-items: center; gap: 6px; color: var(--success); font-weight: 700; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15); animation: pulse-dot 2s infinite; }
    @keyframes pulse-dot { 0%, 100% { box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15); } 50% { box-shadow: 0 0 0 6px rgba(5, 150, 105, 0.05); } }

    #toast-container { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 400; width: calc(100% - 32px); max-width: 400px; pointer-events: none; }
    .toast { background: var(--text-primary); color: #FFFFFF; padding: 14px 16px; border-radius: var(--r-md); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-2xl); transform: translateY(-20px); opacity: 0; transition: all 0.35s var(--ease-spring); overflow: hidden; position: relative; }
    .toast::after { content: ''; position: absolute; bottom: 0; left: 0; height: 2px; background: var(--blue-600); width: 100%; transform-origin: left; animation: toast-progress 2.6s linear forwards; }
    @keyframes toast-progress { from { transform: scaleX(1); } to { transform: scaleX(0); } }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success::after { background: #34D399; }
    .toast.danger { background: #7F1D1D; }
    .toast.danger::after { background: #FCA5A5; }
    .toast.warning { background: #78350F; }
    .toast.warning::after { background: #FCD34D; }
    .toast.info { background: #1E3A8A; }
    .toast.info::after { background: #93C5FD; }
    .toast-icon { flex-shrink: 0; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
    .toast-icon svg { width: 18px; height: 18px; stroke-width: 2.5; fill: none; }
    .toast.success .toast-icon svg { stroke: #34D399; }
    .toast.danger .toast-icon svg { stroke: #FCA5A5; }
    .toast.warning .toast-icon svg { stroke: #FCD34D; }
    .toast.info .toast-icon svg { stroke: #93C5FD; }
    .toast-msg { flex: 1; line-height: 1.35; }

    /* SIDEBAR v8 */
    .sidebar-overlay { position: fixed; inset: 0; background: rgba(10, 22, 51, 0.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 100; opacity: 0; visibility: hidden; transition: all 0.3s var(--ease-out); }

    const t = (key) => (I18N[STATE.lang] && I18N[STATE.lang][key]) || key;

    function formatHTG(n) { return Number(n || 0).toLocaleString('fr-FR') + ' HTG'; }

    function escapeHtml(str) {
      if (str === undefined || str === null) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      container.innerHTML = '';

      const config = {
        success: { icon: '<path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/>' },
        danger:  { icon: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>' },
        warning: { icon: '<path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>' },
        info:    { icon: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>' }
      };

      const c = config[type] || config.success;
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `
        <div class="toast-icon"><svg viewBox="0 0 24 24">${c.icon}</svg></div>
        <div class="toast-msg">${escapeHtml(message)}</div>
      `;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 350); }, 2600);
    }

    function createRipple(e, el) {
      const rect = el.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const x = (e.clientX || e.touches?.[0]?.clientX || rect.left + rect.width / 2) - rect.left - size / 2;
      const y = (e.clientY || e.touches?.[0]?.clientY || rect.top + rect.height / 2) - rect.top - size / 2;
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';
      el.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    }

    function vibrate(ms = 8) { if ('vibrate' in navigator) { try { navigator.vibrate(ms); } catch (e) {} } }

    function copyToClipboard(text, successMsg) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => showToast(successMsg, 'success')).catch(() => fallbackCopy(text, successMsg));
      } else {
        fallbackCopy(text, successMsg);
      }
    }

    function fallbackCopy(text, successMsg) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showToast(successMsg, 'success'); }
      catch (e) { showToast(t('copyFail'), 'danger'); }
      document.body.removeChild(ta);
    }

    function getCart() { try { return JSON.parse(localStorage.getItem('dp_cart') || '[]'); } catch (e) { return []; } }
    function setCart(cart) { localStorage.setItem('dp_cart', JSON.stringify(cart)); }

    function updateCartBadge() {
      const cart = getCart();
      const badge = document.getElementById('cart-badge');
      const navBadge = document.getElementById('nav-cart-badge');
      if (cart.length > 0) {
        if (badge) { badge.textContent = cart.length; badge.classList.add('visible'); }
        if (navBadge) { navBadge.textContent = cart.length; navBadge.classList.add('visible'); }
      } else {
        if (badge) badge.classList.remove('visible');
        if (navBadge) navBadge.classList.remove('visible');
      }
      const pc = document.getElementById('page-count');
      if (pc) pc.textContent = `${cart.length} ${cart.length === 1 ? t('item') : t('items')}`;
    }

    function applyTranslations() {
      document.documentElement.setAttribute('lang', STATE.lang);
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (I18N[STATE.lang][key]) el.textContent = I18N[STATE.lang][key];
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (I18N[STATE.lang][key]) el.setAttribute('placeholder', I18N[STATE.lang][key]);
      });
    }

    function setLang(code, btn) {
      STATE.lang = code;
      localStorage.setItem('dp_lang', code);
      document.querySelectorAll('.lang-pill').forEach(b => b.classList.remove('active'));

      applyTranslations();
      updateSidebarAuthUI();
      renderCart();
      showToast(t('toastLang'), 'info');

    function renderItems() {

      if (!list) return;
      list.innerHTML = STATE.cart.map((item, idx) => {

        else if (item.deliveryInfo && Object.keys(item.deliveryInfo).length > 0) {
          const parts = [];
          if (item.deliveryInfo.playerId) parts.push(`ID: ${item.deliveryInfo.playerId}`);
          if (item.deliveryInfo.username) parts.push(`@${item.deliveryInfo.username}`);
          if (item.deliveryInfo.whatsapp) parts.push(`WA: ${item.deliveryInfo.whatsapp}`);
          if (item.deliveryInfo.meruTag) parts.push(item.deliveryInfo.meruTag);
          delivText = parts.join(' • ');

        return `

            <div class="cart-thumb">
              <div class="cart-thumb-fallback">${escapeHtml(initials)}</div>
              <img src="${escapeHtml(item.logo)}" alt="${escapeHtml(item.title)}" onload="this.previousElementSibling.style.display='none'" onerror="this.style.display='none';">

                <input type="file" class="file-upload-input" id="proof-file" accept="image/*" onchange="handleProofFile(this)">
                <div class="file-upload-box">
                  <div class="file-upload-icon"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
                  <div class="file-upload-text">
                    <div class="file-upload-title" id="proof-title">${escapeHtml(t('proofTitle'))}</div>
                    <div class="file-upload-sub" id="proof-sub">${escapeHtml(t('proofSub'))}</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }
    }

    function selectMethod(method) {
      STATE.selectedMethod = method;
      document.querySelectorAll('.pay-pill').forEach(p => p.classList.toggle('active', p.dataset.method === method));
      renderPaymentDetail();
      checkWalletSufficiency();
      vibrate(5);
    }

    function checkWalletSufficiency() {
      const btn = document.getElementById('btn-submit-order');
      const alertBox = document.getElementById('wallet-alert');
      if (!btn) return;
      const subtotal = STATE.cart.reduce((s, i) => s + Number(i.price || 0), 0);

      if (STATE.selectedMethod === 'wallet') {
        if (STATE.userBalance < subtotal) {
          if (alertBox) alertBox.classList.add('visible');
          btn.disabled = true;
        } else {
          if (alertBox) alertBox.classList.remove('visible');
          btn.disabled = false;
        }
      } else {
        if (alertBox) alertBox.classList.remove('visible');
        btn.disabled = false;
      }
    }

    function handleProofFile(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];

      if (!VALIDATION.imageFile(file)) {
        if (file.size > MAX_FILE_SIZE) showToast(t('fileTooLarge'), 'danger');
        else showToast(t('fileWrongType'), 'danger');
        input.value = '';
        return;
      }

      const titleEl = document.getElementById('proof-title');
      const subEl = document.getElementById('proof-sub');
      if (titleEl) titleEl.textContent = file.name.length > 30 ? file.name.substring(0, 30) + '...' : file.name;
      if (subEl) { subEl.textContent = t('proofSelected'); subEl.style.color = 'var(--success)'; }
    }

    function validateDeliveryField(type, value) {
      const v = String(value || '').trim();
      switch (type) {
        case 'email': return VALIDATION.email(v) ? null : t('invalidEmail');
        case 'whatsapp':
        case 'phone': return VALIDATION.phone(v) ? null : t('invalidPhone');
        case 'playerId':
        case 'gameUid': return VALIDATION.gameUid(v) ? null : t('invalidUid');
        case 'username': return VALIDATION.username(v) ? null : t('invalidUsername');
        case 'password': return VALIDATION.password(v) ? null : t('invalidPassword');
        case 'meruTag': return VALIDATION.meruTag(v) ? null : t('invalidMeruTag');
        case 'walletAddress':
        case 'cryptoAddr': return VALIDATION.cryptoAddr(v) ? null : t('invalidCrypto');
        default: return VALIDATION.shortText(v) ? null : t('fillAll');
      }
    }

    async function submitOrder(e) {
      if (STATE.submitting) return;

      if (!STATE.user) {
        showToast(t('authRequired'), 'danger');
        setTimeout(() => window.location.href = 'authentification/login.html', 1000);
        return;
      }
      if (STATE.cart.length === 0) {
        showToast(t('emptyCart'), 'warning');
        return;
      }

      const subtotal = STATE.cart.reduce((s, i) => s + Number(i.price || 0), 0);
      const btn = document.getElementById('btn-submit-order');

      let txId = '';
      let proofFile = null;
      let proofBase64 = '';

      if (STATE.selectedMethod !== 'wallet') {
        txId = sanitize(document.getElementById('tx-id')?.value || '', 50);
        proofFile = document.getElementById('proof-file')?.files?.[0];

        if (!txId || !proofFile) {
          showToast(t('fillAll'), 'warning');
          return;
        }
        if (!VALIDATION.imageFile(proofFile)) {
          showToast(t('fileTooLarge'), 'danger');
          return;
        }

        try {
          proofBase64 = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(proofFile);
          });
        } catch (err) {
          showToast(t('orderError'), 'danger');
          return;
        }
      } else {
        if (STATE.userBalance < subtotal) {
          showToast(t('insufficientTitle'), 'danger');
          return;
        }
      }

      STATE.submitting = true;
      btn.disabled = true;
      btn.classList.add('loading');

      const cartSnapshot = STATE.cart.slice();

      try {
        const idToken = await STATE.user.getIdToken(true);

        const orderSummaries = [];

        for (const item of cartSnapshot) {
          const orderId = 'DP-' + Math.floor(100000 + Math.random() * 900000);

          await db.collection('orders').doc(orderId).set({
            orderId: orderId,
            userId: STATE.user.uid,
            userEmail: STATE.user.email,
            item: item,
            paymentMethod: STATE.selectedMethod,
            transactionId: txId,
            proofFileName: proofFile ? proofFile.name : '',
            proofDataUrl: proofBase64,
            status: 'en_attente',
            pinCode: null,
            redeemUrl: null,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            createdAtServer: firebase.firestore.FieldValue.serverTimestamp()
          });

          orderSummaries.push({
            orderId: orderId,
            title: item.title,
            offer: item.offerName,
            price: item.price,
            delivery: item.deliveryInfo || {},
            pin: null,
            isAutoDelivered: (item.isPinAutomated === true)
          });
        }

        for (let i = 0; i < cartSnapshot.length; i++) {
          const item = cartSnapshot[i];
          const summary = orderSummaries[i];

          if (item.isPinAutomated && item.packId) {
            try {
              const resp = await fetch('/api/assign-pin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  idToken,
                  packId: item.packId,
                  orderId: summary.orderId
                })
              });
              const data = await resp.json();
              if (data && data.success && data.pinCode) {
                summary.pin = data.pinCode;
              }
            } catch (apiErr) {
              console.warn('[assign-pin] erreur:', apiErr);
            }
          }
        }

        if (STATE.selectedMethod === 'wallet') {
          await db.collection('users').doc(STATE.user.uid).set({
            walletBalance: firebase.firestore.FieldValue.increment(-subtotal)
          }, { merge: true });
        }

        localStorage.removeItem('dp_cart');
        STATE.cart = [];
        renderCart();
        updateCartBadge();
        vibrate(15);

        const manualItems = orderSummaries.filter(s => !s.isAutoDelivered);

        if (manualItems.length > 0) {
          showToast(t('orderSaved'), 'success');

          const manualTotal = manualItems.reduce((sum, s) => sum + Number(s.price || 0), 0);
          const waText = buildWhatsAppMessage(manualItems, manualTotal, txId);
          const waUrl = `https://wa.me/${WHATSAPP_TARGET}?text=${encodeURIComponent(waText)}`;

          setTimeout(() => { window.location.href = waUrl; }, 1800);
        } else {
          showToast(t('orderSavedAuto'), 'success');
          setTimeout(() => { window.location.href = 'commande.html'; }, 1800);
        }

      } catch (err) {
        STATE.submitting = false;
        btn.disabled = false;
        btn.classList.remove('loading');
        showToast(t('orderError'), 'danger');
        console.error('Order error:', err);
      }
    }

    function buildWhatsAppMessage(summaries, total, txId) {
      let msg = `*NOUVELLE COMMANDE — DIGITALPAY HAITI*\n`;
      msg += `━━━━━━━━━━━━━━━━━━━━\n`;
      msg += `*Client :* ${STATE.user.displayName || 'Client'}\n`;
      msg += `*Email :* ${STATE.user.email}\n`;
      msg += `*Paiement :* ${STATE.selectedMethod.toUpperCase()}${txId ? ' (ID: ' + txId + ')' : ''}\n`;
      msg += `*Total :* ${total.toLocaleString()} HTG\n`;
      msg += `━━━━━━━━━━━━━━━━━━━━\n\n`;

      summaries.forEach((s, idx) => {
        msg += `*Article ${idx + 1} :* ${s.title}\n`;
        msg += `*Formule :* ${s.offer}\n`;
        msg += `*Prix :* ${s.price.toLocaleString()} HTG\n`;
        msg += `*Réf :* ${s.orderId}\n`;
        const d = s.delivery;
        if (d.playerId) msg += `*ID Joueur :* ${d.playerId}\n`;
        if (d.email) msg += `*Email :* ${d.email}\n`;
        if (d.password) msg += `*Mot de passe :* ${d.password}\n`;
        if (d.username) msg += `*Utilisateur :* ${d.username}\n`;
        if (d.whatsapp) msg += `*WhatsApp :* ${d.whatsapp}\n`;
        if (d.meruTag) msg += `*Tag Meru :* ${d.meruTag}\n`;
        if (d.walletAddress) msg += `*TRC20 :* ${d.walletAddress}\n`;
        msg += `\n`;
      });

      msg += `━━━━━━━━━━━━━━━━━━━━\n`;
      msg += `_Merci de procéder au traitement de ma commande._`;
      return msg;
    }

    function updateSidebarAuthUI() {
      const userZone = document.getElementById('sidebar-user-zone');
      if (userZone) {
        if (STATE.user) {
          const email = STATE.user.email || '';
          const initials = (email.substring(0, 2) || 'U').toUpperCase();
          userZone.innerHTML = `
            <div class="sidebar-user-card">
              <div class="sidebar-user-avatar">${escapeHtml(initials)}</div>
              <div class="sidebar-user-info">
                <div class="sidebar-user-label">${escapeHtml(t('connectedAs'))}</div>
                <div class="sidebar-user-email">${escapeHtml(email)}</div>
              </div>
            </div>
          `;
        } else {
          userZone.innerHTML = `
            <div class="sidebar-user-card guest">
              <div class="sidebar-user-avatar">?</div>
              <div class="sidebar-user-info">
                <div class="sidebar-user-label">Invité</div>
                <div class="sidebar-user-email">Non connecté</div>
              </div>
            </div>
          `;
        }
      }

      const zone = document.getElementById('sidebar-auth-zone');
      if (!zone) return;
      if (STATE.user) {
        zone.innerHTML = `
          <button class="sidebar-nav-link danger" onclick="handleLogout()">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>${escapeHtml(t('authLogout'))}</span>
          </button>
        `;
      } else {
        zone.innerHTML = `
          <a href="authentification/login.html" class="sidebar-nav-link sidebar-login-btn">
            <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>${escapeHtml(t('authLogin'))}</span>
          </a>
          <a href="authentification/register.html" class="sidebar-nav-link sidebar-register-btn">
            <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
            <span>${escapeHtml(t('authRegister'))}</span>
          </a>
        `;
      }
    }

    function handleLogout() {
      auth.signOut().then(() => {
        showToast(STATE.lang === 'fr' ? 'Déconnexion réussie' : 'Signed out', 'info');
        closeSidebar();
      });
    }

    function openSidebar() { document.getElementById('sidebar-overlay').classList.add('active'); document.body.style.overflow = 'hidden'; }
    function closeSidebar() { document.getElementById('sidebar-overlay').classList.remove('active'); document.body.style.overflow = ''; }

    function initScrollEffects() {
      const header = document.getElementById('site-header');
      window.addEventListener('scroll', () => {
        if (window.scrollY > 20) header.classList.add('scrolled');
        else header.classList.remove('scrolled');
      }, { passive: true });
    }

    function initRipple() {
      document.addEventListener('click', (e) => {
        const btn = e.target.closest('.btn-submit-order, .pay-pill, .icon-btn, .empty-cart-btn, .btn-topup, .btn-copy-inline, .cart-remove');
        if (btn && !btn.disabled) createRipple(e, btn);
      });
    }

    function moveNavIndicator() {
      const indicator = document.getElementById('nav-indicator');
      const track = document.getElementById('nav-track');
      const active = track?.querySelector('.nav-item.active');
      if (!indicator || !track || !active) return;
      const trackRect = track.getBoundingClientRect();
      const btnRect = active.getBoundingClientRect();
      indicator.style.left = (btnRect.left - trackRect.left + btnRect.width / 2 - 15) + 'px';
    }

    let balanceUnsub = null;

    auth.onAuthStateChanged(user => {
      STATE.user = user;

      if (balanceUnsub) { balanceUnsub(); balanceUnsub = null; }

      if (user) {
        balanceUnsub = db.collection('users').doc(user.uid).onSnapshot(doc => {
          if (doc.exists) STATE.userBalance = Number(doc.data().walletBalance) || 0;
          else STATE.userBalance = 0;
          if (STATE.cart.length > 0) checkWalletSufficiency();
          if (STATE.selectedMethod === 'wallet') renderPaymentDetail();
        });
      } else {
        STATE.userBalance = 0;
        if (getCart().length > 0) {
          showToast(t('authRequired'), 'warning');
          setTimeout(() => window.location.href = 'authentification/login.html', 1000);
        }
      }

      updateSidebarAuthUI();
    });

    document.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('dp_lang') || 'fr';
      STATE.lang = saved;
      const langBtn = document.querySelector(`.lang-pill[data-lang="${saved}"]`);
      if (langBtn) {
        document.querySelectorAll('.lang-pill').forEach(b => b.classList.remove('active'));
        langBtn.classList.add('active');
      }
      applyTranslations();
      renderCart();
      updateSidebarAuthUI();
      initScrollEffects();
      initRipple();
      setTimeout(() => {
        moveNavIndicator();
        document.body.classList.add('ready');
      }, 100);
      window.addEventListener('resize', moveNavIndicator);
    });

    window.addEventListener('beforeunload', () => {
      if (balanceUnsub) { try { balanceUnsub(); } catch (e) {} }
    });
  </script>
