<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#00B4FF">
  <script>(function(){try{var t=localStorage.getItem('dp_theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <title>Page introuvable — DigitalPay Haiti</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-page: #F5F7FB; --bg-card: #FFFFFF; --bg-subtle: #F0F4F9;
      --border-subtle: #EDF1F7; --border-default: #E1E8F0; --border-strong: #C7D2E0;
      --text-primary: #0A1633; --text-secondary: #4A5568; --text-tertiary: #8B94A7;
      --blue-50: #E0F2FE; --blue-600: #0055FF; --blue-700: #003BCC;
      --blue-gradient: linear-gradient(135deg, #00B4FF 0%, #0055FF 100%);
      --success: #059669;
      --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px; --r-full: 9999px;
      --shadow-blue: 0 4px 12px rgba(0, 85, 255, 0.22), 0 10px 28px rgba(0, 85, 255, 0.14);
      --shadow-blue-lg: 0 8px 20px rgba(0, 85, 255, 0.28), 0 16px 40px rgba(0, 85, 255, 0.16);
      --shadow-2xl: 0 28px 56px rgba(10, 22, 51, 0.12), 0 12px 24px rgba(10, 22, 51, 0.06);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      background: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      opacity: 0;
      transition: opacity 0.4s ease;
      overflow-x: hidden;
    }
    body.ready { opacity: 1; }

    .shell {
      width: 100%;
      max-width: 460px;
      text-align: center;
      position: relative;
    }

    .logo-wrap {
      margin-bottom: 30px;
      display: flex;
      justify-content: center;
    }
    .logo {
      height: 40px;
      width: auto;
      max-width: 160px;
      object-fit: contain;
      display: block;
    }

    .code {
      font-size: 120px;
      font-weight: 900;
      letter-spacing: -6px;
      line-height: 1;
      background: var(--blue-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
      animation: pulse-code 3s ease-in-out infinite;
      position: relative;
      display: inline-block;
    }
    @keyframes pulse-code {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.88; transform: scale(0.985); }
    }

    .code::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(0, 180, 255, 0.08) 0%, transparent 70%);
      z-index: -1;
      pointer-events: none;
    }

    .title {
      font-size: 24px;
      font-weight: 900;
      color: var(--text-primary);
      letter-spacing: -0.6px;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .sub {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.55;
      max-width: 340px;
      margin: 0 auto 32px;
      font-weight: 500;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 50px;
      padding: 0 24px;
      background: var(--blue-gradient);
      color: #FFFFFF;
      border-radius: var(--r-md);
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: var(--shadow-blue);
      transition: all 0.2s var(--ease-out);
      font-family: inherit;
      border: none;
      cursor: pointer;
      letter-spacing: -0.1px;
      position: relative;
      overflow: hidden;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-blue-lg); }
    .btn:active { transform: scale(0.98); }
    .btn svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 2.2; fill: none; flex-shrink: 0; }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-default);
      box-shadow: none;
    }
    .btn-secondary:hover {
      background: var(--bg-subtle);
      border-color: var(--border-strong);
      box-shadow: none;
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      transform: scale(0);
      animation: ripple-anim 0.6s var(--ease-out);
      pointer-events: none;
    }
    .btn-secondary .ripple { background: rgba(0, 85, 255, 0.15); }
    @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }

    .info-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--blue-50);
      color: var(--blue-700);
      font-size: 11.5px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: var(--r-full);
      margin-bottom: 40px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .info-badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--blue-600);
      box-shadow: 0 0 0 3px rgba(0, 85, 255, 0.15);
      animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { box-shadow: 0 0 0 3px rgba(0, 85, 255, 0.15); }
      50% { box-shadow: 0 0 0 6px rgba(0, 85, 255, 0.05); }
    }

    .footer {
      padding-top: 24px;
      border-top: 1px solid var(--border-subtle);
      font-size: 12px;
      color: var(--text-tertiary);
      font-weight: 600;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .footer-status {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--success);
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
      animation: pulse-status 2s infinite;
    }
    @keyframes pulse-status {
      0%, 100% { box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15); }
      50% { box-shadow: 0 0 0 6px rgba(5, 150, 105, 0.05); }
    }

    @media (max-width: 400px) {
      .code { font-size: 96px; letter-spacing: -5px; }
      .title { font-size: 20px; }
      .sub { font-size: 13px; }
      .btn { font-size: 13px; padding: 0 18px; height: 46px; }
    }

    @media (min-width: 520px) {
      .code { font-size: 140px; }
    }
  </style>

  <link rel="stylesheet" href="/assets/css/design-system.css">
</head>
<body>

  <div class="shell" id="shell">

    <div class="logo-wrap">
      <img src="assets/logo.png" alt="DigitalPay" class="logo" onerror="this.style.display='none'; this.parentElement.style.display='none';">
    </div>

    <div class="info-badge">
      <span class="info-badge-dot"></span>
      <span>Erreur 404</span>
    </div>

    <div class="code">404</div>

    <h1 class="title">Page introuvable</h1>
    <p class="sub">La page que vous recherchez n'existe pas ou a été déplacée. Vérifiez l'adresse ou retournez à l'accueil.</p>

    <div class="actions">
      <a href="index.html" class="btn">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>
        <span>Retour à l'accueil</span>
      </a>
      <a href="help.html" class="btn btn-secondary">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>Support</span>
      </a>
    </div>

    <div class="footer">
      <span>© 2026 DigitalPay S.A.</span>
      <div class="footer-status">
        <span class="status-dot"></span>
        <span>24/7</span>
      </div>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => document.body.classList.add('ready'), 60);
    });

    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.btn');
      if (!btn) return;
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const x = (e.clientX || rect.left + rect.width / 2) - rect.left - size / 2;
      const y = (e.clientY || rect.top + rect.height / 2) - rect.top - size / 2;
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    });
  </script>
<script src="/assets/js/design-system.js"></script>
</body>
</html>
