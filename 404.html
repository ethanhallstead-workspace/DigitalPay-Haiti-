<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#00B4FF">
  <script>(function(){try{var t=localStorage.getItem('dp_theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <title>Page introuvable — DigitalPay Haiti</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/assets/site.webmanifest">

  <style>
    :root {
      --bg-page: #F5F7FB; --bg-card: #FFFFFF; --bg-subtle: #F0F4F9; --bg-hover: #F8FAFC;
      --border-subtle: #EDF1F7; --border-default: #E1E8F0; --border-strong: #C7D2E0;
      --text-primary: #0A1633; --text-secondary: #4A5568; --text-tertiary: #8B94A7; --text-quaternary: #B5BDCA;
      --blue-25: #F0F9FF; --blue-50: #E0F2FE; --blue-100: #BAE6FD; --blue-200: #7DD3FC;
      --blue-400: #38BDF8; --blue-500: #00B4FF; --blue-600: #0055FF; --blue-700: #003BCC;
      --blue-gradient: linear-gradient(135deg, #00B4FF 0%, #0055FF 100%);
      --success: #059669;
      --danger: #DC2626;
      --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px; --r-2xl: 28px; --r-3xl: 36px; --r-full: 9999px;
      --shadow-2xs: 0 1px 1px rgba(10, 22, 51, 0.03);
      --shadow-xs: 0 1px 2px rgba(10, 22, 51, 0.04), 0 1px 1px rgba(10, 22, 51, 0.02);
      --shadow-sm: 0 2px 4px rgba(10, 22, 51, 0.04), 0 1px 2px rgba(10, 22, 51, 0.03);
      --shadow-md: 0 4px 8px rgba(10, 22, 51, 0.05), 0 2px 4px rgba(10, 22, 51, 0.03);
      --shadow-lg: 0 8px 16px rgba(10, 22, 51, 0.06), 0 4px 8px rgba(10, 22, 51, 0.04);
      --shadow-xl: 0 16px 32px rgba(10, 22, 51, 0.08), 0 8px 16px rgba(10, 22, 51, 0.04);
      --shadow-2xl: 0 28px 56px rgba(10, 22, 51, 0.12), 0 12px 24px rgba(10, 22, 51, 0.06);
      --shadow-blue: 0 4px 12px rgba(0, 85, 255, 0.22), 0 10px 28px rgba(0, 85, 255, 0.14);
      --shadow-blue-lg: 0 8px 20px rgba(0, 85, 255, 0.28), 0 16px 40px rgba(0, 85, 255, 0.16);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      background: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      opacity: 0;
      transition: opacity 0.4s ease;
      padding: 24px 20px 40px;
    }
    body.ready { opacity: 1; }

    .shell {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      position: relative;
    }

    /* ═══ LOGO ═══ */
    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    .logo {
      height: 44px;
      width: auto;
      max-width: 180px;
      object-fit: contain;
      display: block;
    }

    /* ═══ HERO 404 ═══ */
    .hero {
      text-align: center;
      margin-bottom: 26px;
      position: relative;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--blue-50);
      color: var(--blue-700);
      font-size: 10.5px;
      font-weight: 900;
      padding: 6px 14px;
      border-radius: var(--r-full);
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      border: 1px solid var(--blue-100);
    }
    .hero-badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--blue-600);
      box-shadow: 0 0 0 3px rgba(0, 85, 255, 0.15);
    }
    .big-404 {
      font-size: clamp(96px, 30vw, 140px);
      font-weight: 900;
      letter-spacing: -6px;
      line-height: 1;
      background: var(--blue-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      position: relative;
      display: inline-block;
      padding: 0 6px;
    }
    .big-404::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(0, 180, 255, 0.1) 0%, transparent 70%);
      z-index: -1;
      pointer-events: none;
    }
    .hero-title {
      font-size: 24px;
      font-weight: 900;
      color: var(--text-primary);
      letter-spacing: -0.7px;
      line-height: 1.2;
      margin-bottom: 10px;
    }
    .hero-sub {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.6;
      max-width: 340px;
      margin: 0 auto;
      font-weight: 500;
    }

    /* ═══ ACTIONS ═══ */
    .actions-row {
      display: flex;
      gap: 10px;
      margin-bottom: 26px;
      flex-wrap: wrap;
    }
    .btn {
      flex: 1;
      min-width: 140px;
      height: 52px;
      padding: 0 18px;
      background: var(--blue-gradient);
      color: #FFFFFF;
      border-radius: var(--r-md);
      font-size: 13.5px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: var(--shadow-blue);
      transition: all 0.2s var(--ease-out);
      font-family: inherit;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: -0.1px;
      position: relative;
      overflow: hidden;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-blue-lg); }
    .btn:active { transform: scale(0.98); }
    .btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.4; fill: none; flex-shrink: 0; }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1.5px solid var(--border-default);
      box-shadow: var(--shadow-xs);
    }
    .btn-secondary:hover {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-sm);
      transform: translateY(-1px);
    }

    .btn-wa {
      background: #10B981;
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
    }
    .btn-wa:hover { box-shadow: 0 8px 24px rgba(16, 185, 129, 0.45); }

    /* ═══ SUGGESTIONS ═══ */
    .suggestions {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--r-xl);
      padding: 18px;
      box-shadow: var(--shadow-xs);
      margin-bottom: 22px;
    }
    .suggestions-title {
      font-size: 12px;
      font-weight: 900;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.7px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .suggestions-title svg { width: 14px; height: 14px; stroke: var(--blue-600); stroke-width: 2.4; fill: none; }
    .suggestions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .suggestion-item {
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: var(--r-md);
      padding: 12px 10px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s var(--ease-out);
      cursor: pointer;
      font-family: inherit;
      width: 100%;
      text-align: left;
    }
    .suggestion-item:hover {
      background: var(--blue-50);
      border-color: var(--blue-200);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }
    .suggestion-item:active { transform: translateY(0) scale(0.98); }
    .suggestion-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--blue-gradient);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(0, 85, 255, 0.25);
    }
    .suggestion-icon svg { width: 16px; height: 16px; stroke: #FFFFFF; stroke-width: 2.4; fill: none; }
    .suggestion-text { min-width: 0; flex: 1; }
    .suggestion-name { font-size: 12.5px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.2px; line-height: 1.2; }
    .suggestion-sub { font-size: 10px; color: var(--text-tertiary); font-weight: 600; margin-top: 2px; }

    /* ═══ FOOTER ═══ */
    .footer {
      text-align: center;
      padding-top: 22px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      font-size: 11.5px;
      color: var(--text-tertiary);
      font-weight: 600;
    }
    .footer-status {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--success);
      font-weight: 800;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      transform: scale(0);
      animation: ripple-anim 0.6s var(--ease-out);
      pointer-events: none;
    }
    .btn-secondary .ripple, .suggestion-item .ripple { background: rgba(0, 85, 255, 0.15); }
    @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }

    /* Dark */
    html[data-theme="dark"] .suggestion-item { background: var(--bg-subtle); }
    html[data-theme="dark"] .suggestion-item:hover { background: rgba(0, 180, 255, 0.08); border-color: var(--blue-500); }
    html[data-theme="dark"] .btn-secondary { background: var(--bg-card); color: var(--text-primary); border-color: var(--border-default); }
  </style>

  <link rel="stylesheet" href="/assets/css/design-system.css">
</head>
<body>

  <div class="shell">

            <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
          </div>
          <div class="suggestion-text">

          <div class="suggestion-icon">

          </div>
          <div class="suggestion-text">
            <div class="suggestion-name" data-i18n="suggHelp">Support</div>
            <div class="suggestion-sub" data-i18n="suggHelpSub">Aide & FAQ</div>
          </div>
        </a>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
      <span>© 2026 DigitalPay S.A.</span>
      <div class="footer-status">
        <span class="status-dot"></span>
        <span>24/7</span>
      </div>
    </div>

  </div>

  <script>
    const STATE = { lang: 'fr' };

    const I18N = {
      fr: {
        title: "Page introuvable",
        sub: "Cette page n'existe pas ou a été déplacée. Revenez à l'accueil ou explorez nos services.",
        homeBtn: "Accueil",
        waBtn: "Support",
        tryTitle: "Vous cherchiez peut-être...",
        suggShop: "Boutique",
        suggShopSub: "Tous les services",
        suggWallet: "Wallet",
        suggWalletSub: "Mon portefeuille",
        suggOrders: "Commandes",
        suggOrdersSub: "Historique",
        suggHelp: "Support",
        suggHelpSub: "Aide & FAQ"
      },
      ht: {
        title: "Paj pa jwenn",
        sub: "Paj sa pa egziste oswa li te deplase. Retounen nan akèy oswa eksplore sèvis nou yo.",
        homeBtn: "Akèy",
        waBtn: "Sipò",
        tryTitle: "Ou t ap chèche petèt...",
        suggShop: "Boutik",
        suggShopSub: "Tout sèvis yo",
        suggWallet: "Bous",
        suggWalletSub: "Bous mwen",
        suggOrders: "Kòmand",
        suggOrdersSub: "Istorik",
        suggHelp: "Sipò",
        suggHelpSub: "Èd & FAQ"
      },
      en: {
        title: "Page not found",
        sub: "This page doesn't exist or has been moved. Go back home or explore our services.",
        homeBtn: "Home",
        waBtn: "Support",
        tryTitle: "Were you looking for...",
        suggShop: "Shop",
        suggShopSub: "All services",
        suggWallet: "Wallet",
        suggWalletSub: "My wallet",
        suggOrders: "Orders",
        suggOrdersSub: "History",
        suggHelp: "Support",
        suggHelpSub: "Help & FAQ"
      },
      es: {
        title: "Página no encontrada",
        sub: "Esta página no existe o ha sido movida. Vuelva al inicio o explore nuestros servicios.",
        homeBtn: "Inicio",
        waBtn: "Soporte",
        tryTitle: "¿Buscaba quizás...?",
        suggShop: "Tienda",
        suggShopSub: "Todos los servicios",
        suggWallet: "Billetera",
        suggWalletSub: "Mi billetera",
        suggOrders: "Pedidos",
        suggOrdersSub: "Historial",
        suggHelp: "Soporte",
        suggHelpSub: "Ayuda y FAQ"
      }
    };

    const t = (key) => (I18N[STATE.lang] && I18N[STATE.lang][key]) || key;

    function applyTranslations() {
      document.documentElement.setAttribute('lang', STATE.lang);
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (I18N[STATE.lang][key]) el.textContent = I18N[STATE.lang][key];
      });
    }

    function createRipple(e, el) {
      const rect = el.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const x = (e.clientX || rect.left + rect.width / 2) - rect.left - size / 2;
      const y = (e.clientY || rect.top + rect.height / 2) - rect.top - size / 2;
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';
      el.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('dp_lang') || 'fr';
      STATE.lang = I18N[saved] ? saved : 'fr';
      applyTranslations();

      document.addEventListener('click', (e) => {
        const btn = e.target.closest('.btn, .suggestion-item');
        if (btn) createRipple(e, btn);
      });

      setTimeout(() => document.body.classList.add('ready'), 60);
    });

    window.addEventListener('storage', (e) => {
      if (e.key === 'dp_lang' && I18N[e.newValue]) {
        STATE.lang = e.newValue;
        applyTranslations();
      }
    });
  </script>
  <script src="/assets/js/design-system.js"></script>
</body>
