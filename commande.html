<html lang="fr">
<head>
  <meta charset="UTF-8">

  <title>Historique — DigitalPay Haiti</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/assets/site.webmanifest">

  <style>
    :root {
      /* ===== DIGITALPAY HAÏTI v8 — Palette dérivée du logo (cyan → bleu profond) ===== */
      --bg-page: #F5F7FB; --bg-card: #FFFFFF; --bg-subtle: #F0F4F9; --bg-hover: #F8FAFC;
      --bg-glass: rgba(245, 247, 251, 0.72);
      --border-subtle: #EDF1F7; --border-default: #E1E8F0; --border-strong: #C7D2E0;
      --text-primary: #0A1633; --text-secondary: #4A5568; --text-tertiary: #8B94A7; --text-quaternary: #B5BDCA;
      --blue-25: #F0F9FF; --blue-50: #E0F2FE; --blue-100: #BAE6FD; --blue-200: #7DD3FC;
      --blue-400: #38BDF8; --blue-500: #00B4FF; --blue-600: #0055FF; --blue-700: #003BCC;
      --blue-gradient: linear-gradient(135deg, #00B4FF 0%, #0055FF 100%);
      --success: #059669; --success-bg: #ECFDF5; --success-border: #A7F3D0;
      --danger: #DC2626; --danger-bg: #FEF2F2; --danger-border: #FECACA;
      --warning: #D97706; --warning-bg: #FFFBEB;
      --gold: #F59E0B;
      --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px; --r-2xl: 28px; --r-3xl: 36px; --r-full: 9999px;
      --shadow-2xs: 0 1px 1px rgba(10, 22, 51, 0.03);
      --shadow-xs: 0 1px 2px rgba(10, 22, 51, 0.04), 0 1px 1px rgba(10, 22, 51, 0.02);
      --shadow-sm: 0 2px 4px rgba(10, 22, 51, 0.04), 0 1px 2px rgba(10, 22, 51, 0.03);
      --shadow-md: 0 4px 8px rgba(10, 22, 51, 0.05), 0 2px 4px rgba(10, 22, 51, 0.03);
      --shadow-lg: 0 8px 16px rgba(10, 22, 51, 0.06), 0 4px 8px rgba(10, 22, 51, 0.04);
      --shadow-xl: 0 16px 32px rgba(10, 22, 51, 0.08), 0 8px 16px rgba(10, 22, 51, 0.04);
      --shadow-2xl: 0 28px 56px rgba(10, 22, 51, 0.12), 0 12px 24px rgba(10, 22, 51, 0.06);
      --shadow-blue: 0 4px 12px rgba(0, 85, 255, 0.22), 0 10px 28px rgba(0, 85, 255, 0.14);
      --shadow-blue-lg: 0 8px 20px rgba(0, 85, 255, 0.28), 0 16px 40px rgba(0, 85, 255, 0.16);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body { background: var(--bg-page); color: var(--text-primary); font-family: var(--font); font-size: 14px; line-height: 1.5; overflow-x: hidden; min-height: 100vh; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; opacity: 0; transition: opacity 0.4s ease; padding-bottom: 90px; }
    body.ready { opacity: 1; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 3px; }

    .app-shell { width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg-page); position: relative; display: flex; flex-direction: column; border-left: 1px solid var(--border-subtle); border-right: 1px solid var(--border-subtle); }
    .icon-svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; display: inline-block; vertical-align: middle; }

    .site-header { position: sticky; top: 0; z-index: 40; background: var(--bg-glass); backdrop-filter: saturate(180%) blur(24px); -webkit-backdrop-filter: saturate(180%) blur(24px); border-bottom: 1px solid transparent; padding: 14px 18px; transition: all 0.3s var(--ease-out); }
    .site-header.scrolled { border-bottom-color: var(--border-subtle); padding: 10px 18px; box-shadow: var(--shadow-xs); }
    .header-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
    .brand-logo { height: 32px; width: auto; max-width: 130px; object-fit: contain; cursor: pointer; display: block; transition: all 0.3s var(--ease-out); }
    .site-header.scrolled .brand-logo { height: 28px; }
    .header-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .icon-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--border-default); display: flex; align-items: center; justify-content: center; color: var(--text-primary); cursor: pointer; position: relative; text-decoration: none; transition: all 0.2s var(--ease-out); box-shadow: var(--shadow-2xs); flex-shrink: 0; }
    .icon-btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }
    .icon-btn:active { transform: scale(0.9); }
    .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; }
    .cart-badge { position: absolute; top: -3px; right: -3px; background: var(--blue-gradient); color: #FFFFFF; font-size: 10px; font-weight: 800; min-width: 19px; height: 19px; padding: 0 5px; border-radius: var(--r-full); display: none; align-items: center; justify-content: center; box-shadow: 0 0 0 2px var(--bg-page); line-height: 1; }
    .cart-badge.visible { display: flex; }

    .orders-main { padding: 22px 18px 24px; flex: 1; }

    .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .page-title { font-size: 24px; font-weight: 900; color: var(--text-primary); letter-spacing: -0.7px; line-height: 1.15; }
    .page-count { background: var(--bg-subtle); border: 1px solid var(--border-subtle); color: var(--blue-600); font-size: 11.5px; font-weight: 800; padding: 4px 10px; border-radius: var(--r-full); white-space: nowrap; }

    .filter-pills { display: flex; gap: 6px; margin-bottom: 18px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .filter-pills::-webkit-scrollbar { display: none; }
    .filter-pill { background: var(--bg-card); border: 1px solid var(--border-default); color: var(--text-secondary); padding: 7px 14px; border-radius: var(--r-full); font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; transition: all 0.2s var(--ease-out); flex-shrink: 0; display: flex; align-items: center; gap: 6px; }
    .filter-pill:active { transform: scale(0.96); }
    .filter-pill.active { background: var(--text-primary); border-color: var(--text-primary); color: #FFFFFF; }
    .filter-pill svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2.4; fill: none; }

    .orders-list { display: flex; flex-direction: column; gap: 12px; }
    .order-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--r-xl); padding: 16px; box-shadow: var(--shadow-xs); transition: all 0.25s var(--ease-out); }
    .order-card:hover { border-color: var(--border-default); box-shadow: var(--shadow-sm); }

    .order-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .order-thumb { width: 52px; height: 52px; border-radius: var(--r-md); overflow: hidden; background: linear-gradient(135deg, var(--bg-subtle) 0%, #E8EEF7 100%); border: 1px solid var(--border-subtle); flex-shrink: 0; position: relative; display: flex; align-items: center; justify-content: center; }
    .order-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .order-thumb-fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; color: var(--text-quaternary); text-transform: uppercase; letter-spacing: -0.5px; }
    .order-head-info { flex: 1; min-width: 0; }
    .order-title { font-size: 14px; font-weight: 800; color: var(--text-primary); line-height: 1.25; letter-spacing: -0.2px; }
    .order-offer { font-size: 12px; color: var(--text-secondary); font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .order-price-row { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; }
    .order-price { font-size: 15px; font-weight: 900; color: var(--blue-600); letter-spacing: -0.3px; }

    .order-status-pill { font-size: 10px; font-weight: 800; padding: 3px 9px; border-radius: var(--r-full); text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; flex-shrink: 0; align-self: flex-start; margin-top: 2px; }
    .order-status-pill.en_attente, .order-status-pill.en_attente_stock { background: var(--warning-bg); color: var(--warning); }
    .order-status-pill.livre { background: var(--success-bg); color: var(--success); }
    .order-status-pill.rejete { background: var(--danger-bg); color: var(--danger); }

    .order-details { background: var(--bg-subtle); border: 1px solid var(--border-subtle); border-radius: var(--r-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .order-detail-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; font-size: 12px; }
    .order-detail-key { color: var(--text-secondary); font-weight: 600; flex-shrink: 0; }
    .order-detail-val { font-weight: 800; color: var(--text-primary); text-align: right; word-break: break-all; font-family: monospace; font-size: 11.5px; }
    .order-detail-val.regular { font-family: inherit; font-size: 12px; }

    .pin-zone { background: linear-gradient(135deg, var(--blue-25) 0%, var(--blue-50) 100%); border: 1px solid var(--blue-100); border-radius: var(--r-md); padding: 14px; margin-top: 12px; position: relative; overflow: hidden; }
    .pin-zone::after { content: ''; position: absolute; top: -40px; right: -40px; width: 120px; height: 120px; background: radial-gradient(circle, rgba(0, 180, 255, 0.08) 0%, transparent 70%); pointer-events: none; }
    .pin-label { font-size: 10.5px; font-weight: 800; color: var(--blue-700); text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; position: relative; z-index: 1; }
    .pin-label svg { width: 13px; height: 13px; stroke: var(--blue-600); stroke-width: 2.4; fill: none; }
    .pin-display { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: #FFFFFF; border: 1.5px dashed var(--blue-200); border-radius: var(--r-sm); margin-bottom: 10px; position: relative; z-index: 1; }
    .pin-code { flex: 1; font-family: monospace; font-size: 15px; font-weight: 900; color: var(--blue-700); letter-spacing: 1.5px; word-break: break-all; }
    .btn-copy-pin { background: var(--blue-gradient); color: #FFFFFF; border: none; border-radius: var(--r-xs); padding: 6px 12px; font-size: 10.5px; font-weight: 800; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 5px; transition: all 0.15s ease; flex-shrink: 0; }
    .btn-copy-pin:hover { transform: scale(1.02); box-shadow: var(--shadow-blue); }
    .btn-copy-pin:active { transform: scale(0.96); }
    .btn-copy-pin svg { width: 11px; height: 11px; stroke: #FFFFFF; stroke-width: 2.4; fill: none; }

    .btn-redeem { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 42px; background: var(--blue-gradient); color: #FFFFFF; border-radius: var(--r-sm); font-size: 12.5px; font-weight: 800; text-decoration: none; box-shadow: var(--shadow-blue); transition: all 0.2s var(--ease-out); position: relative; z-index: 1; letter-spacing: -0.1px; }
    .btn-redeem:hover { transform: translateY(-1px); box-shadow: var(--shadow-blue-lg); }
    .btn-redeem:active { transform: scale(0.98); }
    .btn-redeem svg { width: 15px; height: 15px; stroke: #FFFFFF; stroke-width: 2.2; fill: none; }

    .empty-orders { text-align: center; padding: 60px 24px; }
    .empty-orders-icon { width: 80px; height: 80px; border-radius: 50%; background: var(--bg-subtle); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
    .empty-orders-icon svg { width: 34px; height: 34px; stroke: var(--text-tertiary); stroke-width: 1.8; fill: none; }
    .empty-orders-title { font-size: 18px; font-weight: 900; color: var(--text-primary); margin-bottom: 6px; letter-spacing: -0.3px; }
    .empty-orders-sub { font-size: 13px; color: var(--text-secondary); max-width: 280px; margin: 0 auto 22px; line-height: 1.5; }
    .empty-orders-btn { background: var(--blue-gradient); color: #FFFFFF; padding: 14px 28px; border-radius: var(--r-md); font-size: 14px; font-weight: 800; text-decoration: none; box-shadow: var(--shadow-blue); display: inline-flex; align-items: center; gap: 8px; font-family: inherit; transition: all 0.2s ease; }
    .empty-orders-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-blue-lg); }
    .empty-orders-btn svg { width: 16px; height: 16px; stroke: #FFFFFF; stroke-width: 2.2; fill: none; }

    .skeleton-order { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--r-xl); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .skeleton-block { background: linear-gradient(90deg, var(--bg-subtle) 0%, #E4EAF2 50%, var(--bg-subtle) 100%); background-size: 200% 100%; animation: skeleton-load 1.5s infinite; border-radius: var(--r-md); }
    .skeleton-row { display: flex; gap: 12px; align-items: center; }
    .skeleton-square { width: 52px; height: 52px; border-radius: var(--r-md); flex-shrink: 0; }
    .skeleton-lines { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .skeleton-line { height: 12px; }
    .skeleton-line-sm { height: 10px; width: 60%; }
    @keyframes skeleton-load { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .ripple { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.5); transform: scale(0); animation: ripple-anim 0.6s var(--ease-out); pointer-events: none; }
    @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }

    .site-footer { background: var(--bg-card); border-top: 1px solid var(--border-subtle); padding: 18px; }
    .footer-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; color: var(--text-tertiary); gap: 12px; }
    .footer-status { display: flex; align-items: center; gap: 6px; color: var(--success); font-weight: 700; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15); animation: pulse-dot 2s infinite; }
    @keyframes pulse-dot { 0%, 100% { box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15); } 50% { box-shadow: 0 0 0 6px rgba(5, 150, 105, 0.05); } }

    #toast-container { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 400; width: calc(100% - 32px); max-width: 400px; pointer-events: none; }
    .toast { background: var(--text-primary); color: #FFFFFF; padding: 14px 16px; border-radius: var(--r-md); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-2xl); transform: translateY(-20px); opacity: 0; transition: all 0.35s var(--ease-spring); overflow: hidden; position: relative; }
    .toast::after { content: ''; position: absolute; bottom: 0; left: 0; height: 2px; background: var(--blue-600); width: 100%; transform-origin: left; animation: toast-progress 2.6s linear forwards; }
    @keyframes toast-progress { from { transform: scaleX(1); } to { transform: scaleX(0); } }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success::after { background: #34D399; }
    .toast.danger { background: #7F1D1D; }
    .toast.danger::after { background: #FCA5A5; }
    .toast.warning { background: #78350F; }
    .toast.warning::after { background: #FCD34D; }
    .toast.info { background: #1E3A8A; }
    .toast.info::after { background: #93C5FD; }
    .toast-icon { flex-shrink: 0; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
    .toast-icon svg { width: 18px; height: 18px; stroke-width: 2.5; fill: none; }
    .toast.success .toast-icon svg { stroke: #34D399; }
    .toast.danger .toast-icon svg { stroke: #FCA5A5; }
    .toast.warning .toast-icon svg { stroke: #FCD34D; }
    .toast.info .toast-icon svg { stroke: #93C5FD; }
    .toast-msg { flex: 1; line-height: 1.35; }

    .sidebar-overlay { position: fixed; inset: 0; background: rgba(10, 22, 51, 0.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 100; opacity: 0; visibility: hidden; transition: all 0.3s var(--ease-out); }
    .sidebar-overlay.active { opacity: 1; visibility: visible; }
    .sidebar-drawer { position: fixed; top: 0; right: 0; width: min(85vw, 360px); height: 100vh; background: var(--bg-card); z-index: 101; transform: translateX(100%); transition: transform 0.4s var(--ease-out); display: flex; flex-direction: column; box-shadow: -20px 0 60px rgba(10, 22, 51, 0.2); }
    .sidebar-overlay.active .sidebar-drawer { transform: translateX(0); }
    .sidebar-content { padding: 26px 22px 22px; display: flex; flex-direction: column; height: 100%; overflow-y: auto; }
    .sidebar-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 18px; border-bottom: 1px solid var(--border-subtle); }
    .sidebar-brand { display: flex; align-items: center; gap: 12px; }
    .sidebar-logo-wrap { width: 46px; height: 46px; border-radius: var(--r-md); background: var(--bg-subtle); border: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
    .sidebar-logo-wrap img { width: 100%; height: 100%; object-fit: contain; }
    .sidebar-brand-name { font-size: 16px; font-weight: 900; color: var(--text-primary); letter-spacing: -0.4px; line-height: 1.1; }
    .sidebar-brand-sub { font-size: 12px; font-weight: 600; color: var(--text-tertiary); letter-spacing: 0.3px; }
    .sidebar-close { width: 34px; height: 34px; border-radius: 50%; background: var(--bg-subtle); border: none; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
    .sidebar-close svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.4; fill: none; }
    .sidebar-label { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-tertiary); margin: 22px 0 10px; }
    .lang-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .lang-pill { background: var(--bg-subtle); border: 1px solid transparent; padding: 10px 12px; border-radius: var(--r-sm); display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--text-primary); cursor: pointer; font-family: inherit; transition: all 0.18s ease; }
    .lang-pill.active { background: var(--blue-50); border-color: var(--blue-600); color: var(--blue-600); font-weight: 800; }
    .lang-pill .flag { font-size: 15px; line-height: 1; }
    .sidebar-nav { margin-top: 6px; display: flex; flex-direction: column; gap: 2px; }
    .sidebar-nav-link { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: var(--r-md); color: var(--text-primary); text-decoration: none; font-size: 14px; font-weight: 600; transition: all 0.18s ease; cursor: pointer; font-family: inherit; background: none; border: none; width: 100%; text-align: left; }
    .sidebar-nav-link:hover { background: var(--bg-hover); }
    .sidebar-nav-link.active { background: var(--bg-subtle); color: var(--blue-600); font-weight: 700; }
    .sidebar-nav-link svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; flex-shrink: 0; }
    .sidebar-nav-link.active svg { stroke: var(--blue-600); }

    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(255, 255, 255, 0.94); backdrop-filter: saturate(180%) blur(24px); -webkit-backdrop-filter: saturate(180%) blur(24px); border-top: 1px solid var(--border-subtle); padding: 8px 10px 12px; z-index: 55; box-shadow: 0 -2px 16px rgba(10, 22, 51, 0.04); }
    .nav-track { position: relative; display: flex; align-items: center; justify-content: space-around; }
    .nav-indicator { position: absolute; bottom: 0; height: 3px; border-radius: var(--r-full); background: var(--blue-gradient); transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 2px 8px rgba(0, 85, 255, 0.4); width: 30px; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px; background: none; border: none; cursor: pointer; font-family: inherit; color: var(--text-tertiary); transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); position: relative; text-decoration: none; }
    .nav-item:active { transform: scale(0.92); }
    .nav-item.active { color: var(--blue-600); }
    .nav-icon-wrap { position: relative; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }

    const t = (key) => (I18N[STATE.lang] && I18N[STATE.lang][key]) || key;

    function escapeHtml(str) {
      if (str === undefined || str === null) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      container.innerHTML = '';
      const config = {
        success: { icon: '<path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/>' },
        danger:  { icon: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>' },
        warning: { icon: '<path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>' },
        info:    { icon: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>' }
      };
      const c = config[type] || config.success;
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<div class="toast-icon"><svg viewBox="0 0 24 24">${c.icon}</svg></div><div class="toast-msg">${escapeHtml(message)}</div>`;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 350); }, 2600);
    }

    function createRipple(e, el) {
      const rect = el.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const x = (e.clientX || e.touches?.[0]?.clientX || rect.left + rect.width / 2) - rect.left - size / 2;
      const y = (e.clientY || e.touches?.[0]?.clientY || rect.top + rect.height / 2) - rect.top - size / 2;
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';
      el.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    }

    function vibrate(ms = 8) { if ('vibrate' in navigator) { try { navigator.vibrate(ms); } catch (e) {} } }

    function extractTimestamp(data) {
      if (!data) return Date.now();
      const fields = ['createdAtServer', 'createdAt'];
      for (const f of fields) {
        const v = data[f];
        if (!v) continue;
        if (typeof v.toMillis === 'function') return v.toMillis();
        if (v.seconds) return v.seconds * 1000;
        if (typeof v === 'number') return v;
        if (typeof v === 'string') { const p = new Date(v).getTime(); if (!isNaN(p)) return p; }
      }
      return Date.now();
    }

    function copyToClipboard(text, successMsg) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => showToast(successMsg, 'success')).catch(() => fallbackCopy(text, successMsg));
      } else { fallbackCopy(text, successMsg); }
    }

    function fallbackCopy(text, successMsg) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showToast(successMsg, 'success'); }
      catch (e) { showToast(t('copyFail'), 'danger'); }
      document.body.removeChild(ta);
    }

    function applyTranslations() {
      document.documentElement.setAttribute('lang', STATE.lang);

    function renderOrders() {
      const target = document.getElementById('orders-list');
      if (!target) return;

      let filtered = STATE.orders.slice().sort((a, b) => b.timestamp - a.timestamp);
      if (STATE.filter === 'en_attente') filtered = filtered.filter(o => o.status === 'en_attente' || o.status === 'en_attente_stock');
      if (STATE.filter === 'livre') filtered = filtered.filter(o => o.status === 'livre');

      const cEl = document.getElementById('orders-count');
      if (cEl) cEl.textContent = filtered.length;

      if (filtered.length === 0) {
        target.innerHTML = `
          <div class="empty-orders">
            <div class="empty-orders-icon">
              <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>

              ${escapeHtml(t('emptyBtn'))}
            </a>
          </div>
        `;
        return;
      }

      target.innerHTML = filtered.map(renderOrderCard).join('');
    }

    function renderOrderCard(order) {
      const item = order.item || {};
      const deliv = item.deliveryInfo || {};
      const initials = (item.title || '?').substring(0, 2).toUpperCase();
      const dateStr = new Date(order.timestamp).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });

      let statusClass = 'en_attente';
      let statusLabel = t('statusPending');
      if (order.status === 'livre') { statusClass = 'livre'; statusLabel = t('statusDelivered'); }
      else if (order.status === 'rejete') { statusClass = 'rejete'; statusLabel = t('statusRejected'); }
      else if (order.status === 'en_attente_stock') { statusClass = 'en_attente'; statusLabel = t('statusStock'); }

      const details = [];
      if (deliv.playerId) details.push(`<div class="order-detail-row"><span class="order-detail-key">${escapeHtml(t('detailUID'))}</span><span class="order-detail-val">${escapeHtml(deliv.playerId)}</span></div>`);

      if (deliv.username) details.push(`<div class="order-detail-row"><span class="order-detail-key">${escapeHtml(t('detailUsername'))}</span><span class="order-detail-val">${escapeHtml(deliv.username)}</span></div>`);

      if (deliv.meruTag) details.push(`<div class="order-detail-row"><span class="order-detail-key">${escapeHtml(t('detailMeruTag'))}</span><span class="order-detail-val">${escapeHtml(deliv.meruTag)}</span></div>`);
      if (deliv.walletAddress) details.push(`<div class="order-detail-row"><span class="order-detail-key">${escapeHtml(t('detailCrypto'))}</span><span class="order-detail-val">${escapeHtml(deliv.walletAddress)}</span></div>`);

      const pinZone = (order.pinCode && order.status === 'livre') ? `
        <div class="pin-zone">
          <div class="pin-label">
            <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <span>${escapeHtml(t('pinLabel'))}</span>
          </div>
          <div class="pin-display">
            <span class="pin-code">${escapeHtml(order.pinCode)}</span>
            <button class="btn-copy-pin" onclick="copyPin('${escapeHtml(order.pinCode)}')">
              <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
              <span>${escapeHtml(t('copyPin'))}</span>
            </button>
          </div>
          <a href="${escapeHtml(order.redeemUrl || 'https://redeem.hype.games/')}" target="_blank" rel="noopener noreferrer" class="btn-redeem">
            <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            <span>${escapeHtml(t('redeemBtn'))}</span>
          </a>
        </div>
      ` : '';

      return `
        <div class="order-card">
          <div class="order-head">
            <div class="order-thumb">
              <div class="order-thumb-fallback">${escapeHtml(initials)}</div>
              <img src="${escapeHtml(item.logo || '')}" alt="" onload="this.previousElementSibling.style.display='none'" onerror="this.style.display='none';">
            </div>
            <div class="order-head-info">
              <div class="order-title">${escapeHtml(item.title || 'Produit')}</div>
              <div class="order-offer">${escapeHtml(item.offerName || '')}</div>
              <div class="order-price-row"><span class="order-price">${Number(item.price || 0).toLocaleString()} HTG</span></div>
            </div>
            <span class="order-status-pill ${statusClass}">${escapeHtml(statusLabel)}</span>
          </div>

          <div class="order-details">
            <div class="order-detail-row"><span class="order-detail-key">${escapeHtml(t('orderRef'))}</span><span class="order-detail-val">${escapeHtml(order.orderId)}</span></div>
            <div class="order-detail-row"><span class="order-detail-key">${escapeHtml(t('orderDate'))}</span><span class="order-detail-val regular">${escapeHtml(dateStr)}</span></div>
            <div class="order-detail-row"><span class="order-detail-key">${escapeHtml(t('orderPayment'))}</span><span class="order-detail-val regular">${escapeHtml((order.paymentMethod || 'wallet').toUpperCase())}</span></div>
            ${details.join('')}
          </div>

          ${pinZone}
        </div>
      `;
    }

    function copyPin(pin) {
      copyToClipboard(pin, t('copied'));
      vibrate(6);
    }

    function listenOrders() {
      if (STATE.unsubOrders) STATE.unsubOrders();

      STATE.unsubOrders = db.collection('orders')
        .where('userId', '==', STATE.user.uid)
        .onSnapshot(snap => {
          STATE.orders = [];
          snap.forEach(doc => {
            const o = doc.data();
            STATE.orders.push({
              orderId: o.orderId || doc.id,
              item: o.item || {},
              status: o.status || 'en_attente',
              pinCode: o.pinCode || null,
              redeemUrl: o.redeemUrl || null,
              paymentMethod: o.paymentMethod || 'wallet',
              timestamp: extractTimestamp(o)
            });
          });
          renderOrders();
        }, () => {});
    }

    function updateSidebarAuthUI() {
      // Carte utilisateur en haut
      const userZone = document.getElementById('sidebar-user-zone');
      if (userZone) {
        if (STATE.user) {
          const email = STATE.user.email || '';
          const initials = (email.substring(0, 2) || 'U').toUpperCase();
          userZone.innerHTML = `
            <div class="sidebar-user-card">
              <div class="sidebar-user-avatar">${escapeHtml(initials)}</div>
              <div class="sidebar-user-info">
                <div class="sidebar-user-label">${escapeHtml(t('connectedAs'))}</div>
                <div class="sidebar-user-email">${escapeHtml(email)}</div>
              </div>
            </div>
          `;
        } else {
          userZone.innerHTML = `
            <div class="sidebar-user-card guest">
              <div class="sidebar-user-avatar">?</div>
              <div class="sidebar-user-info">
                <div class="sidebar-user-label">Invité</div>
                <div class="sidebar-user-email">Non connecté</div>
              </div>
            </div>
          `;
        }
      }

      // Zone auth DANS la nav
      const zone = document.getElementById('sidebar-auth-zone');
      if (!zone) return;
      if (STATE.user) {
        zone.innerHTML = `
          <button class="sidebar-nav-link danger" onclick="handleLogout()">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>${escapeHtml(t('authLogout'))}</span>
          </button>
        `;
      } else {
        zone.innerHTML = `
          <a href="authentification/login.html" class="sidebar-nav-link sidebar-login-btn">
            <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>${escapeHtml(t('authLogin'))}</span>
          </a>
          <a href="authentification/register.html" class="sidebar-nav-link sidebar-register-btn">
            <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
            <span>${escapeHtml(t('authRegister'))}</span>
          </a>
        `;
      }
    }

    function handleLogout() {
      auth.signOut().then(() => {
        showToast(STATE.lang === 'fr' ? 'Déconnexion réussie' : 'Signed out', 'info');
        closeSidebar();
      });
    }

    function openSidebar() { document.getElementById('sidebar-overlay').classList.add('active'); document.body.style.overflow = 'hidden'; }
    function closeSidebar() { document.getElementById('sidebar-overlay').classList.remove('active'); document.body.style.overflow = ''; }

    let scrollRaf = null;
    function initScrollEffects() {
      const header = document.getElementById('site-header');
      window.addEventListener('scroll', () => {
        if (scrollRaf) return;
        scrollRaf = requestAnimationFrame(() => {
          if (window.scrollY > 20) header.classList.add('scrolled');
          else header.classList.remove('scrolled');
          scrollRaf = null;
        });
      }, { passive: true });
    }

    function initRipple() {
      document.addEventListener('click', (e) => {
        const btn = e.target.closest('.btn-redeem, .btn-copy-pin, .icon-btn, .filter-pill, .empty-orders-btn');
        if (btn && !btn.disabled) createRipple(e, btn);
      });
    }

    function updateCartBadge() {
      try {
        const cart = JSON.parse(localStorage.getItem('dp_cart') || '[]');
        const badge = document.getElementById('cart-badge');
        const navBadge = document.getElementById('nav-cart-badge');
        if (cart.length > 0) {
          if (badge) { badge.textContent = cart.length; badge.classList.add('visible'); }
          if (navBadge) { navBadge.textContent = cart.length; navBadge.classList.add('visible'); }
        } else {
          if (badge) badge.classList.remove('visible');
          if (navBadge) navBadge.classList.remove('visible');
        }
      } catch (e) {}
    }

    function moveNavIndicator() {
      const indicator = document.getElementById('nav-indicator');
      const track = document.getElementById('nav-track');
      const active = track?.querySelector('.nav-item.active');
      if (!indicator || !track || !active) return;
      const trackRect = track.getBoundingClientRect();
      const btnRect = active.getBoundingClientRect();
      indicator.style.left = (btnRect.left - trackRect.left + btnRect.width / 2 - 15) + 'px';
    }

    auth.onAuthStateChanged(user => {
      STATE.user = user;

      if (!user) {
        showToast(t('authRequired'), 'warning');
        setTimeout(() => window.location.href = 'authentification/login.html', 1000);
        return;
      }

      updateSidebarAuthUI();
      listenOrders();
    });

    document.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('dp_lang') || 'fr';
      STATE.lang = saved;
      const langBtn = document.querySelector(`.lang-pill[data-lang="${saved}"]`);
      if (langBtn) {
        document.querySelectorAll('.lang-pill').forEach(b => b.classList.remove('active'));
        langBtn.classList.add('active');
      }
      applyTranslations();
      updateSidebarAuthUI();
      updateCartBadge();
      initScrollEffects();
      initRipple();
      setTimeout(() => {
        moveNavIndicator();
        document.body.classList.add('ready');
      }, 100);
      window.addEventListener('resize', moveNavIndicator);
    });

    window.addEventListener('beforeunload', () => {
      if (STATE.unsubOrders) { try { STATE.unsubOrders(); } catch (e) {} }
    });
  </script>
  <script src="/assets/js/notifications.js"></script>
  <script src="/assets/js/chat.js"></script>
  <script src="/assets/js/design-system.js"></script>
  <script src="/assets/js/ux-enhancements.js"></script>
  <script src="/assets/js/wishlist.js"></script>
  <script src="/assets/js/features.js"></script>
</body>
</html>
